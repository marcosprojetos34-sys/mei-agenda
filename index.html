<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MEI agenda — Calendário do Freelancer</title>

<!-- PWA: manifest -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7C5CFC">

<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ══════════════════════════════════════
   MEI AGENDA — Design System v8
   Cor única: Violeta #7C5CFC
   Filosofia: Uma cor. Muito ar. Hierarquia clara.
══════════════════════════════════════ */

:root{
  /* ── Fundos: fundo cinza frio, cards brancos ── */
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --surface2:#F8F8FC;
  --surface3:#EFEFF5;

  /* ── Uma cor só ── */
  --brand:#7C5CFC;
  --brand-dark:#6344E8;
  --brand-light:#9B82FD;
  --brand-glow:rgba(124,92,252,.12);
  --brand-glow2:rgba(124,92,252,.06);

  /* ── Aliases (usados no código existente) ── */
  --primary:var(--brand);
  --primary2:var(--brand-dark);
  --primary-glow:var(--brand-glow);
  --accent:var(--brand);

  /* ── Semânticas — só onde o significado importa ── */
  --green:#16A34A;   /* dinheiro, ganho, trabalhado  */
  --amber:#CA8A04;   /* atenção, sem serviço         */
  --red:#DC2626;     /* erro, exclusão               */

  /* ── Tipografia: 3 níveis e só ── */
  --text:#0F0F0F;    /* títulos, valores             */
  --mid:#3D3D3D;     /* corpo de texto               */
  --muted:#9A9A9A;   /* labels, legendas             */

  /* ── Bordas minimalistas ── */
  --border:#E8E8ED;
  --border2:#DDDDE5;

  /* ── Raios ── */
  --rsm:10px;--rmd:14px;--rlg:20px;

  /* ── Sombras: cartão flutuando sobre fundo ── */
  --sh:0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 6px 20px rgba(0,0,0,.09),0 2px 6px rgba(0,0,0,.05);
  --sh3:0 12px 36px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.06);
  --sh-primary:0 4px 16px rgba(124,92,252,.35);

  --font:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;

  /* Células calendário — claro: fundo médio visível */
  --cell-filled:#DDDCF0;
  --cell-available:#E8E6F8;
  --logo-filter:invert(1) brightness(0);
  /* Faixa folga/sem serviço no histórico */
  --hist-neutral:#7B7A92;
}

body.dark{
  /* ── Fundos dark: cinza-carvão, não preto ── */
  --bg:#131316;
  --surface:#1C1C20;
  --surface2:#242428;
  --surface3:#2C2C32;

  /* ── Cor única — mesma no dark, mais clara ── */
  --brand:#9B82FD;
  --brand-dark:#7C5CFC;
  --brand-light:#B9A4FE;
  --brand-glow:rgba(155,130,253,.15);
  --brand-glow2:rgba(155,130,253,.07);

  --primary:var(--brand);
  --primary2:var(--brand-dark);
  --primary-glow:var(--brand-glow);
  --accent:var(--brand);

  --green:#4ADE80;
  --amber:#FCD34D;
  --red:#F87171;

  --text:#F4F4F5;
  --mid:#A1A1AA;
  --muted:#71717A;

  --border:#2A2A30;
  --border2:#333339;

  --sh:0 2px 8px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  --sh2:0 6px 20px rgba(0,0,0,.5);
  --sh3:0 12px 36px rgba(0,0,0,.6);
  --sh-primary:0 4px 16px rgba(155,130,253,.3);

  /* Células calendário — escuro: cinza médio visível */
  --cell-filled:#2E2D42;
  --cell-available:#2A2840;
  --logo-filter:none;
  /* Faixa folga/sem serviço no histórico */
  --hist-neutral:#3A3A48;
}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;transition:background .3s,color .3s}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
#root{height:100vh;display:flex;justify-content:center;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;width:100%;max-width:480px;overflow:hidden}

/* ── Header ── */
.mhdr{
  background:var(--surface);color:var(--text);
  padding:16px 20px 14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.mhdr-left{}
.mhdr-label{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:1px}
.mhdr-title{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1.1}
.mhdr-title span{color:var(--brand)}
.mhdr-today{
  border:none;background:var(--brand-glow);color:var(--brand);
  padding:7px 14px;border-radius:100px;font-family:var(--font);font-size:12px;
  font-weight:700;cursor:pointer;transition:all .2s;
}
.mhdr-today:hover{background:var(--brand);color:#fff}

/* ── Tabs (bottom) ── */
.mtabs{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;order:99}
.mtab{flex:1;padding:12px 6px 10px;border:none;background:none;font-family:var(--font);
  font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;letter-spacing:.3px;
  border-top:2px solid transparent;transition:all .2s;text-align:center}
.mtab.on{color:var(--brand);border-top-color:var(--brand)}
.mtab-icon{display:flex;justify-content:center;margin-bottom:4px}
.content{flex:1;overflow-y:auto;min-height:0;background:var(--bg)}

/* ── Stats bar ── */
.statsbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 16px}
.scard{background:var(--surface);border-radius:var(--rmd);padding:14px 12px;
  box-shadow:var(--sh);border:1px solid var(--border)}
.scard-icon{margin-bottom:8px;display:flex}
.scard-val{font-size:18px;font-weight:800;line-height:1;letter-spacing:-.5px}
.scard-lbl{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-top:5px;line-height:1.3}
.scard.accent-g .scard-val{color:var(--brand)}
.scard.accent-b .scard-val{color:var(--accent)}
.scard.accent-a .scard-val{color:var(--amber)}

/* ── Calendar ── */
.calwrap{padding:16px 16px 4px;background:var(--bg);flex:1}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calnav h2{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.navbtn{width:34px;height:34px;border:1px solid var(--border);background:transparent;
  border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;
  justify-content:center;box-shadow:none;transition:all .18s;color:var(--text)}
.navbtn:hover{background:var(--primary-glow);color:var(--primary);border-color:var(--primary)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.wday{text-align:center;font-size:10px;font-weight:700;color:var(--muted);
  padding:4px 0;text-transform:uppercase;letter-spacing:.5px}
.wday.we{color:var(--red)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dcell{aspect-ratio:1;border-radius:var(--rsm);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--surface);
  transition:transform .12s,box-shadow .12s;position:relative;min-height:38px;user-select:none}
.dcell:hover{transform:scale(1.07);box-shadow:var(--sh2);z-index:1;border-color:var(--accent)}
.dcell:active{transform:scale(.96)}
.dcell.empty{border:none;background:transparent;cursor:default}
.dcell.empty:hover{transform:none;box-shadow:none}
.dcell.istoday{border-color:var(--primary);border-width:2px;box-shadow:0 0 0 2px var(--primary-glow)}
.dcell.worked{border-color:transparent}
.dcell.dayoff{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.35)}
.dcell.available{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.30)}
.dnum{font-size:13px;font-weight:700;line-height:1;color:var(--text)}
.dcell.worked .dnum,.dcell.dayoff .dnum,.dcell.available .dnum{color:var(--text)}
.dcell.dayoff .dnum{color:var(--amber)}
.dcell.istoday .dnum{color:var(--accent);font-weight:900}
.dcell.worked.istoday .dnum{color:#fff}
.dcell.qpsel{border-color:var(--primary)!important;border-width:2px!important;box-shadow:0 0 0 3px var(--primary-glow)}
.dtag{font-size:8px;font-weight:800;color:var(--brand);
  margin-top:2px;letter-spacing:.3px;line-height:1;text-transform:uppercase;
  max-width:100%;overflow:hidden;text-overflow:clip;text-align:center;padding:0 2px}
.dtag.tag-dayoff{color:var(--amber)}
.dtag.tag-available{color:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px 0}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:500}
.ldot{width:11px;height:11px;border-radius:3px;flex-shrink:0}

/* ── Quick Pick Panel ── */
.qpanel{background:var(--surface);border-radius:var(--rmd);box-shadow:var(--sh3);
  border:1.5px solid var(--border);padding:12px;margin:8px 16px 0;
  animation:fadeUp .15s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.qp-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:1.5px;margin-bottom:10px}
.qp-companies{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:4px}
.qp-co{border:none;border-radius:10px;padding:10px 12px;cursor:pointer;
  font-size:12px;font-weight:700;color:#fff;font-family:var(--font);
  display:flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s;width:100%}
.qp-co:hover{transform:scale(1.02);box-shadow:var(--sh2)}
.qp-clients{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--border)}
.qp-client{border:2px solid;border-radius:8px;padding:10px 12px;cursor:pointer;
  font-size:12px;font-weight:700;background:transparent;font-family:var(--font);
  transition:all .12s;width:100%}
.qp-client:hover{color:#fff}
.qp-actions{display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.qp-edit{font-size:11px;color:var(--brand);background:none;border:none;
  cursor:pointer;font-weight:600;font-family:var(--font)}
.qp-close{font-size:11px;color:var(--muted);background:none;border:none;
  cursor:pointer;font-family:var(--font)}

/* ── Overlay / Modal ── */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.78);
  backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:460px;
  border-radius:0 0 var(--rlg) var(--rlg);padding:28px 22px 36px;
  max-height:90vh;overflow-y:auto;animation:sup .22s ease-out;
  box-shadow:var(--sh3);border:none}
@keyframes sup{from{transform:translateY(-22px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.msub{font-size:10px;font-weight:600;color:var(--brand);text-transform:uppercase;
  letter-spacing:2px;margin-bottom:6px}
.mtitle{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.mclose{width:32px;height:32px;border:1px solid var(--border2);background:var(--surface2);
  border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:2px;color:var(--muted);transition:all .18s}
.mclose:hover{background:var(--red);border-color:var(--red);color:#fff}

/* ── Divider ── */
.divider{height:1px;background:var(--border);margin:20px 0}
.sec-mini{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}

/* ── Forms ── */
.fg{margin-bottom:18px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--muted);
  letter-spacing:.3px;margin-bottom:8px}
.fi{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--rmd);
  font-family:var(--font);font-size:15px;color:var(--text);background:var(--surface);
  outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.fi:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-glow)}
select.fi{cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.srow{display:flex;gap:8px}
.sbtn{flex:1;padding:10px 6px;border:1.5px solid var(--border);border-radius:var(--rsm);
  cursor:pointer;font-family:var(--font);font-size:12px;font-weight:700;
  background:var(--surface2);color:var(--muted);transition:all .18s;text-align:center;line-height:1.4}
.sbtn.sw{background:var(--brand-glow);border-color:var(--brand);color:var(--brand)}
.sbtn.sf{background:var(--surface3);border-color:var(--border2);color:var(--muted)}
.sbtn.sa{background:var(--primary-glow);border-color:var(--primary);color:var(--accent)}

/* ── Quick presets ── */
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.preset-btn{padding:5px 10px;border:1.5px solid var(--border);border-radius:100px;
  background:transparent;font-family:var(--font);font-size:11px;font-weight:700;
  color:var(--muted);cursor:pointer;transition:all .18s;white-space:nowrap}
.preset-btn:hover{border-color:var(--primary);color:var(--primary)}
.preset-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* ── Duplicate picker ── */
.dup-tip{font-size:12px;color:var(--muted);margin-bottom:8px}

/* ── Buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;
  padding:15px 18px;border:none;border-radius:var(--rmd);
  font-family:var(--font);font-size:15px;font-weight:700;
  cursor:pointer;transition:all .2s;width:100%;letter-spacing:-.2px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-p{background:var(--brand);color:#fff;box-shadow:var(--sh-primary)}
.btn-p:hover:not(:disabled){background:var(--brand-dark);box-shadow:0 6px 24px rgba(124,92,252,.4)}
.btn-d{background:transparent;color:var(--red);border:1.5px solid var(--border)}
.btn-d:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn-g{background:transparent;color:var(--brand);border:1.5px solid var(--border)}
.btn-g:hover{background:var(--brand);color:#fff}
.btn-out{background:transparent;border:1.5px solid var(--border);color:var(--mid)}
.btn-out:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-glow)}
.brow{display:flex;gap:8px;margin-top:6px}
.brow .btn{flex:1}
.brow .btn-d{flex:0 0 auto;width:50px;padding:13px 0}

/* ── Companies tab ── */
.tabwrap{padding:16px;background:var(--bg);min-height:100%}
.section-h{margin-bottom:16px}
.sec-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.sec-h2{font-size:24px;font-weight:800;margin-top:4px;color:var(--text);letter-spacing:-.6px}
.cocard{background:var(--surface);border-radius:var(--rmd);padding:16px;margin-bottom:8px;
  box-shadow:var(--sh);border:none;
  display:flex;align-items:center;gap:14px}
.cobadge{width:42px;height:42px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-glow);color:var(--brand);font-weight:800;font-size:14px;border:1.5px solid var(--brand-glow)}
.coname{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.costats{display:flex;gap:0;margin-left:auto;align-items:center}
.costat{text-align:center;padding:0 14px;border-left:1px solid var(--border)}
.costat:first-child{border-left:none}
.costat-val{font-size:15px;font-weight:800;color:var(--brand)}
.costat-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.editbtn{width:30px;height:30px;border:1px solid var(--border2);background:var(--surface2);
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .18s;color:var(--muted)}
.editbtn:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;
  padding:18px;border:1.5px dashed var(--border);border-radius:var(--rmd);
  background:transparent;cursor:pointer;font-family:var(--font);
  font-size:14px;font-weight:600;color:var(--muted);width:100%;transition:all .2s}
.addbtn:hover:not(:disabled){border-color:var(--brand);color:var(--brand);background:var(--brand-glow)}
.addbtn:disabled{opacity:.3;cursor:not-allowed}

/* ── Onboarding card ── */
.onboard{background:var(--brand-glow2);border:1.5px solid var(--brand-glow);
  border-radius:var(--rmd);padding:20px;margin-bottom:16px}
.onboard h3{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--brand)}
.onboard p{font-size:13px;color:var(--mid);line-height:1.6}
.onboard ol{font-size:13px;color:var(--mid);line-height:2;padding-left:18px;margin-top:6px}

/* ── Report tab ── */
.rcard{background:var(--surface);border-radius:var(--rmd);padding:18px;margin-bottom:10px;box-shadow:var(--sh);border:none}
.rcard-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px}
.ptable{width:100%;border-collapse:collapse;font-size:12.5px}
.ptable th{text-align:left;padding:7px 8px;background:var(--surface2);
  font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
.ptable td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.ptable tr:last-child td{border-bottom:none}
.ptable tr:hover td{background:var(--surface2)}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.sumline+.sumline{border-top:1px solid var(--border)}
.sumtotal{font-size:17px;font-weight:800;color:var(--brand)}
.empty-state{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-icon{font-size:40px;display:block;margin-bottom:8px}

/* ── Company breakdown bar ── */
.breakdown{margin-top:10px}
.bk-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.bk-label{width:90px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mid)}
.bk-bar-wrap{flex:1;background:var(--surface3);border-radius:100px;height:5px;overflow:hidden}
.bk-bar{height:100%;border-radius:100px;transition:width .4s ease}
.bk-val{width:80px;text-align:right;font-weight:700;color:var(--accent);white-space:nowrap}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--surface);padding:11px 24px;border-radius:100px;
  font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback} = React;

/* -- Constants --------------------------------------------------- */
const COLORS = [
  '#7C5CFC','#6344E8','#9B82FD','#5B4AE0',
  '#8B6FFF','#7055F0','#A090FE','#6652EC',
  '#9270FB','#7B60F5','#8568FF','#6E58F2',
  '#9D85FE','#7462F3','#8A70FC','#6A50EE',
  '#967EFD','#7866F4','#8C72FB','#6B52EF'
];
const NCOLORS=COLORS.length;
const MONTHS  = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                 'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const WDAYS   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WDLONG  = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const HR_PRESETS = [
  {label:'7h-16h', start:'07:00',end:'16:00'},
  {label:'8h-17h', start:'08:00',end:'17:00'},
  {label:'8h-18h', start:'08:00',end:'18:00'},
  {label:'9h-18h', start:'09:00',end:'18:00'},
];

/* -- Helpers ------------------------------------------------------ */
const dkey = d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${dd}`;};
const bkey = (y,m0,d)=>`${y}-${String(m0+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const fmtD  = k=>{if(!k)return'';const[y,m,d]=k.split('-');return`${d}/${m}/${y}`;};
const fmtM  = v=>{const n=Number(v)||0;return 'R$ '+n.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
const fmtMS = v=>{const n=Number(v)||0;if(n===0)return 'R$ 0';if(n>=1000)return 'R$ '+(n/1000).toFixed(1).replace('.0','')+'k';return 'R$ '+n.toFixed(0);};
const diffH = (s,e)=>{if(!s||!e)return 0;const[sh,sm]=s.split(':').map(Number);const[eh,em]=e.split(':').map(Number);return Math.max(0,((eh*60+em)-(sh*60+sm))/60);};
const TODAY  = dkey(new Date());
const nowDate= new Date();

/* -- Storage ------------------------------------------------------ */
const db={
  async get(k){
    if(window.storage){try{const r=await window.storage.get('mei_'+k);return r?JSON.parse(r.value):null;}catch{return null;}}
    try{const v=localStorage.getItem('mei_'+k);return v?JSON.parse(v):null;}catch{return null;}
  },
  async set(k,v){
    const s=JSON.stringify(v);
    if(window.storage){try{await window.storage.set('mei_'+k,s);}catch{}}
    else{try{localStorage.setItem('mei_'+k,s);}catch{}}
  }
};

/* -- Crypto ------------------------------------------------------- */
const hashPassword=async(pass)=>{
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pass));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
};

/* -- Toast -------------------------------------------------------- */
function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2400);return()=>clearTimeout(t);},[]);
  return<div className="toast">{msg}</div>;
}

/* -- CompanyModal ------------------------------------------------- */
function CompanyModal({company,colorIdx,onSave,onDelete,onClose}){
  const defaultColor=company?.color||COLORS[colorIdx%NCOLORS];
  const[name,setName]=useState(company?.name||'');
  const[selColor,setSelColor]=useState(defaultColor);
  const[showPicker,setShowPicker]=useState(false);
  const pickerRef=useRef(null);

  useEffect(()=>{
    if(!showPicker||!pickerRef.current)return;
    pickerRef.current.innerHTML='';
    const picker=new iro.ColorPicker(pickerRef.current,{
      width:210,color:selColor,borderWidth:1,borderColor:'#E1E8F0',
      layout:[{component:iro.ui.Wheel},{component:iro.ui.Slider,options:{sliderType:'value'}}]
    });
    picker.on('color:change',c=>setSelColor(c.hexString));
  },[showPicker]);

  const save=()=>{
    if(!name.trim()){alert('Informe o nome da empresa');return;}
    onSave({name:name.trim(),color:selColor,clients:company?.clients||[]});
  };

  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{paddingBottom:24}}>
        <div className="mhead" style={{marginBottom:16}}>
          <div><div className="msub">{company?'Editar':'Nova'} Empresa</div></div>
          <button className="mclose" onClick={onClose}>x</button>
        </div>
        <div className="fg">
          <label className="fl">Nome da Empresa *</label>
          <input className="fi" value={name} onChange={e=>setName(e.target.value)}
            placeholder="Ex: Tech Solutions Ltda" autoFocus/>
        </div>
        <div className="fg" style={{marginBottom:4}}>
          <label className="fl" style={{marginBottom:8}}>Cor da Empresa</label>
          <button onClick={()=>setShowPicker(p=>!p)} style={{
            display:'flex',alignItems:'center',gap:10,padding:'9px 13px',
            border:'1.5px solid var(--border)',borderRadius:'var(--rsm)',
            background:'var(--surface)',cursor:'pointer',width:'100%',fontFamily:'var(--font)'}}>
            <div style={{width:26,height:26,borderRadius:7,background:selColor,
              boxShadow:'0 0 0 2px #fff,0 0 0 4px '+selColor+'55',flexShrink:0}}/>
            <span style={{fontSize:13,fontWeight:700,color:'var(--text)',flex:1,textAlign:'left'}}>{selColor.toUpperCase()}</span>
            <span style={{fontSize:11,color:'var(--muted)'}}>{showPicker?'^ Fechar':'v Escolher'}</span>
          </button>
          {showPicker&&(
            <div style={{display:'flex',justifyContent:'center',marginTop:12,padding:'12px 0',
              border:'1.5px solid var(--border)',borderRadius:'var(--rsm)',background:'#FAFBFC'}}>
              <div ref={pickerRef}/>
            </div>
          )}
        </div>
        <div className="brow" style={{marginTop:16}}>
          <button className="btn btn-p" onClick={save}>OK Salvar empresa</button>
          {company&&<button className="btn btn-d" style={{flex:'0 0 50px',width:50}} onClick={()=>{onDelete();onClose();}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>}
        </div>
      </div>
    </div>
  );
}

/* -- ClientModal -------------------------------------------------- */
function ClientModal({client,company,onSave,onDelete,onClose}){
  const defaultColor=client?.color||company?.color||COLORS[0];
  const[name,setName]=useState(client?.name||'');
  const[location,setLocation]=useState(client?.location||'');
  const[rate,setRate]=useState(client?.rate!=null?String(client.rate):'');
  const[selColor,setSelColor]=useState(defaultColor);
  const[showPicker,setShowPicker]=useState(false);
  const pickerRef=useRef(null);

  useEffect(()=>{
    if(!showPicker||!pickerRef.current)return;
    pickerRef.current.innerHTML='';
    const picker=new iro.ColorPicker(pickerRef.current,{
      width:210,color:selColor,borderWidth:1,borderColor:'#E1E8F0',
      layout:[{component:iro.ui.Wheel},{component:iro.ui.Slider,options:{sliderType:'value'}}]
    });
    picker.on('color:change',c=>setSelColor(c.hexString));
  },[showPicker]);

  const save=()=>{

/* -- HistoryView -------------------------------------------------- */
function HistoryView({workDays,companies}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth());

  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
               'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DIAS_ABR=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const prevMo=()=>{if(mo===0){setMo(11);setYr(y=>y-1);}else setMo(m=>m-1);};
  const nextMo=()=>{if(mo===11){setMo(0);setYr(y=>y+1);}else setMo(m=>m+1);};
  const isNow=yr===now.getFullYear()&&mo===now.getMonth();

  // Coleta todos os dias registrados no mês ordenados
  const prefix=`${yr}-${String(mo+1).padStart(2,'0')}-`;
  const entries=Object.entries(workDays)
    .filter(([k])=>k.startsWith(prefix))
    .sort(([a],[b])=>a.localeCompare(b));

  // Agrupa por dia
  const dias=entries.reduce((acc,[k,v])=>{
    if(!acc[k])acc[k]=[];
    acc[k].push({...v,dateKey:k});
    return acc;
  },{});

  const touchStartX=React.useRef(null);
  const touchStartY=React.useRef(null);
  const handleTouchStart=(e)=>{
    touchStartX.current=e.touches[0].clientX;
    touchStartY.current=e.touches[0].clientY;
  };
  const handleTouchEnd=(e)=>{
    if(touchStartX.current===null)return;
    const diffX=touchStartX.current-e.changedTouches[0].clientX;
    const diffY=touchStartY.current-e.changedTouches[0].clientY;
    // Só troca mês se movimento horizontal for maior que vertical E maior que 60px
    if(Math.abs(diffX)>Math.abs(diffY)&&Math.abs(diffX)>60){
      diffX>0?nextMo():prevMo();
    }
    touchStartX.current=null;
    touchStartY.current=null;
  };

  const fmtDiaLabel=(key)=>{
    const[y,m,d]=key.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const diaSem=DIAS_ABR[dt.getDay()];
    const mes=MESES[m-1].slice(0,3).toLowerCase();
    return `${diaSem}. . ${d} ${mes}.`;
  };

  const getComp=(id)=>companies.find(c=>c.id===id);
  const getCl=(co,clId)=>(co?.clients||[]).find(c=>c.id===clId);

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>

      {/* Barra de navegação mês */}
      <div style={{background:'var(--surface)',borderBottom:'1px solid var(--border)',
        padding:'10px 16px',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <button onClick={prevMo} style={{width:36,height:36,borderRadius:10,border:'1.5px solid var(--border)',
          background:'none',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',
          justifyContent:'center',color:'var(--primary)',fontFamily:'var(--font)'}}>{'<'}</button>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:16,fontWeight:800,color:'var(--text)'}}>{MESES[mo]}</div>
          <div style={{fontSize:11,fontWeight:700,color:'var(--muted)',marginTop:1}}>{yr}</div>
        </div>
        <button onClick={nextMo} style={{width:36,height:36,borderRadius:10,
          border:'1.5px solid var(--border)',background:'none',cursor:'pointer',
          fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',
          color:'var(--primary)',fontFamily:'var(--font)'}}>{'>'}</button>
      </div>

      {/* Lista de dias */}
      <div style={{flex:1,overflowY:'auto',padding:'14px 16px',display:'flex',flexDirection:'column',gap:16}}
        onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
        {Object.keys(dias).length===0?(
          <div style={{textAlign:'center',paddingTop:60,color:'var(--muted)'}}>
            <div style={{fontSize:36,marginBottom:12}}></div>
            <div style={{fontSize:15,fontWeight:700,color:'var(--text)',marginBottom:6}}>Nenhum registro</div>
            <div style={{fontSize:13}}>Nenhum dia registrado em {MESES[mo].toLowerCase()} de {yr}</div>
          </div>
        ):Object.entries(dias).map(([key,registros])=>{
          // pega o primeiro registro do dia para identificar status
          const r0=registros[0];
          const isDayoff=r0.status==='dayoff';
          const isAvail=r0.status==='available';
          const isWorked=r0.status==='worked';

          return(
            <div key={key}>
              {/* Data fora do card */}
              <div style={{fontSize:12,fontWeight:800,color:'var(--muted)',
                textTransform:'uppercase',letterSpacing:.5,marginBottom:6,paddingLeft:2}}>
                {fmtDiaLabel(key)}
              </div>

              {/* Card do dia */}
              {(isDayoff||isAvail)?(
                <div style={{background:'var(--surface)',borderRadius:14,
                  boxShadow:'var(--sh)',overflow:'hidden'}}>
                  {/* Faixa topo — mesma estrutura do card de trabalho */}
                  <div style={{background:isDayoff?'var(--amber)':'var(--red)',
                    padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:32,height:32,borderRadius:8,flexShrink:0,
                      background:'rgba(255,255,255,.2)',
                      display:'flex',alignItems:'center',justifyContent:'center',
                      color:'#fff',fontWeight:900,fontSize:13}}>
                      {isDayoff?'FL':'SS'}
                    </div>
                    <div>
                      <div style={{fontSize:10,fontWeight:700,color:'rgba(255,255,255,.7)',
                        textTransform:'uppercase',letterSpacing:1}}>Registro do dia</div>
                      <div style={{fontSize:14,fontWeight:800,color:'#fff'}}>
                        {isDayoff?'Folga':'Sem Serviço'}
                      </div>
                    </div>
                  </div>
                  {/* Corpo — traço lateral + avatar com ícone SVG, igual ao card de trabalho */}
                  <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px'}}>
                    <div style={{width:40,flexShrink:0,display:'flex',justifyContent:'center'}}>
                      <div style={{width:3,height:36,borderRadius:2,
                        background:isDayoff?'var(--amber)':'var(--red)'}}/>
                    </div>
                    <div style={{width:38,height:38,borderRadius:10,flexShrink:0,
                      background:isDayoff?'var(--amber)':'var(--red)',
                      display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {isDayoff
                        ?<svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='#fff' strokeWidth='2' strokeLinecap='round' strokeLinejoin='round'><path d='M18 8h1a4 4 0 0 1 0 8h-1'/><path d='M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z'/><line x1='6' y1='1' x2='6' y2='4'/><line x1='10' y1='1' x2='10' y2='4'/><line x1='14' y1='1' x2='14' y2='4'/></svg>
                        :<svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='#fff' strokeWidth='2' strokeLinecap='round' strokeLinejoin='round'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/><line x1='6' y1='14' x2='18' y2='22'/></svg>}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:800,
                        color:isDayoff?'var(--amber)':'var(--red)'}}>
                        {isDayoff?'Dia de descanso':'Dia sem serviço'}
                      </div>
                      <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>
                        {isDayoff?'Nenhum serviço prestado neste dia':'Disponível, mas sem demanda registrada'}
                      </div>
                    </div>
                  </div>
                </div>
              ):(
                /* Card de trabalho - agrupa por contratante */
                (()=>{
                  const porEmpresa={};
                  registros.forEach(r=>{
                    const coId=r.companyId||'_';
                    if(!porEmpresa[coId])porEmpresa[coId]=[];
                    porEmpresa[coId].push(r);
                  });
                  return Object.entries(porEmpresa).map(([coId,regs])=>{
                    const co=getComp(coId);
                    return(
                      <div key={coId} style={{background:'var(--surface)',borderRadius:14,
                        boxShadow:'var(--sh)',overflow:'hidden',marginBottom:8}}>

                        {/* Cabeçalho contratante - estilo categoria */}
                        <div style={{background:co?.color||'var(--primary)',
                          padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>
                          <div style={{width:32,height:32,borderRadius:8,flexShrink:0,

                            display:'flex',alignItems:'center',justifyContent:'center',
                            color:'#fff',fontWeight:900,fontSize:13}}>
                            {(co?.name||'?').slice(0,2).toUpperCase()}
                          </div>
                          <div>
                            <div style={{fontSize:10,fontWeight:700,color:'rgba(255,255,255,.7)',
                              textTransform:'uppercase',letterSpacing:1}}>Contratante</div>
                            <div style={{fontSize:14,fontWeight:800,color:'#fff'}}>
                              {co?.name||'Empresa'}
                            </div>
                          </div>
                        </div>

                        {/* Linhas de serviço */}
                        {regs.map((r,i)=>{
                          const cl=getCl(co,r.clientId);
                          const clColor=cl?.color||co?.color||'var(--primary)';
                          return(
                            <div key={i} style={{
                              display:'flex',alignItems:'center',gap:12,
                              padding:'12px 14px',
                              borderTop:i>0?'1px solid var(--border)':'none'}}>
                              {/* Horário */}
                              <div style={{width:40,flexShrink:0,textAlign:'center'}}>
                                {r.startTime?(
                                  <div style={{fontSize:12,fontWeight:800,color:'var(--muted)'}}>
                                    {r.startTime}
                                  </div>
                                ):(
                                  <div style={{width:3,height:36,background:clColor,
                                    borderRadius:2,margin:'0 auto'}}/>
                                )}
                              </div>
                              {/* Badge cliente */}
                              <div style={{width:38,height:38,borderRadius:10,flexShrink:0,
                                background:clColor,display:'flex',alignItems:'center',
                                justifyContent:'center',color:'#fff',fontWeight:900,fontSize:13}}>
                                {(r.clientName||'?').slice(0,2).toUpperCase()}
                              </div>
                              {/* Info cliente */}
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{fontSize:14,fontWeight:800,color:clColor}}>
                                  {r.clientName||'Cliente'}
                                </div>
                                <div style={{fontSize:11,color:'var(--muted)',marginTop:2,
                                  display:'flex',gap:8,flexWrap:'wrap'}}>
                                  {r.location&&<span>{r.location}</span>}
                                  {r.tipo&&<span> {r.tipo}</span>}
                                </div>
                              </div>
                              {/* Valor */}
                              {r.rate>0&&(
                                <div style={{fontSize:13,fontWeight:800,
                                  color:'var(--brand)',flexShrink:0}}>
                                  {fmtM(r.rate)}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    );
                  });
                })()
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* -- CalendarView ------------------------------------------------- */
function CalendarView({workDays,companies,currentDate,onMonthChange,onDayClick,onQuickSave,goToday,hideCalVal,onToggleCalVal}){
  const yr=currentDate.getFullYear(),mo=currentDate.getMonth();
  const firstWD=new Date(yr,mo,1).getDay();
  const dimMo=new Date(yr,mo+1,0).getDate();
  const prevD=new Date(yr,mo,0).getDate();

  const[qp,setQp]=useState(null); // {key, step:'co'|'cl', coId}

  const todayObj=new Date();
  const weekStart=new Date(todayObj);weekStart.setDate(todayObj.getDate()-todayObj.getDay());
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);
  const inCurWeek=k=>{const d=new Date(k+'T12:00:00');return d>=weekStart&&d<=weekEnd;};

  const cells=[];
  for(let i=firstWD-1;i>=0;i--)cells.push({d:prevD-i,cur:false});
  for(let d=1;d<=dimMo;d++)cells.push({d,cur:true,k:bkey(yr,mo,d)});
  const rem=42-cells.length;
  for(let d=1;d<=rem;d++)cells.push({d,cur:false});

  // Cor da célula: usa cor do cliente se disponível, senão cor da empresa
  const getColor=k=>{
    const dd=workDays[k];
    if(!dd)return'';
    if(dd.status==='dayoff')return'#94A3B8';
    if(dd.status==='available')return'#9B82FD';
    if(dd.status==='worked'){
      const co=companies.find(x=>x.id===dd.companyId);
      if(dd.clientId){
        const cl=(co?.clients||[]).find(x=>x.id===dd.clientId);
        if(cl?.color)return'var(--brand)';
      }
      return'var(--brand)';
    }
    return'var(--brand)';
  };

  const handleDayClick=(k,dd)=>{
    if(companies.length===0&&!dd){onDayClick(k,dd);}
    else{setQp(qp?.key===k?null:{key:k,step:dd?'view':'co',coId:dd?.companyId||null,dayData:dd||null});}
  };

  // Escolheu empresa
  const pickCompany=coId=>{
    const co=companies.find(c=>c.id===coId);
    const cls=co?.clients||[];
    if(cls.length===0){
      onQuickSave(qp.key,{status:'worked',companyId:coId,clientId:null,
        clientName:'',location:'',tipo:'Diária',quantidade:1,rate:0});
      setQp(null);
    } else if(cls.length===1){
      const cl=cls[0];
      onQuickSave(qp.key,{status:'worked',companyId:coId,clientId:cl.id,
        clientName:cl.name,location:cl.location||'',tipo:'Diária',quantidade:1,rate:cl.rate||0});
      setQp(null);
    } else {
      setQp(p=>({...p,step:'cl',coId}));
    }
  };

  // Escolheu cliente -> salva com dados do cliente
  const pickClient=cl=>{
    onQuickSave(qp.key,{status:'worked',companyId:qp.coId,clientId:cl.id,
      clientName:cl.name,location:cl.location||'',tipo:'Diária',quantidade:1,rate:cl.rate||0});
    setQp(null);
  };

  const touchX=useRef(null);
  const onTouchStart=e=>touchX.current=e.touches[0].clientX;
  const onTouchEnd=e=>{
    if(touchX.current===null)return;
    const dx=e.changedTouches[0].clientX-touchX.current;
    if(Math.abs(dx)>50)onMonthChange(dx<0?1:-1);
    touchX.current=null;
  };

  const selCo=qp?.coId?companies.find(c=>c.id===qp.coId):null;

  return(
    <div>
      <div className="calwrap" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        <div className="calnav">
          <button className="navbtn" onClick={()=>onMonthChange(-1)}>{'<'}</button>
          <div style={{textAlign:'center'}}>
            <h2>{MONTHS[mo]} {yr}</h2>
          </div>
          <button className="navbtn" onClick={()=>onMonthChange(1)}>{'>'}</button>
        </div>
        <div className="wdays">
          {WDAYS.map((w,i)=><div key={w} className={`wday ${i===0||i===6?'we':''}`}>{w}</div>)}
        </div>
        <div className="calgrid">
          {cells.map((cell,i)=>{
            if(!cell.cur)return<div key={i} className="dcell empty"/>;
            const dd=workDays[cell.k];
            const color=getColor(cell.k);
            const isToday=cell.k===TODAY;
            const curWk=inCurWeek(cell.k);
            const isQp=qp?.key===cell.k;
            const cls=['dcell',dd?.status||'',isToday?'istoday':''].join(' ');
            // tag: nome do cliente se tiver, senão empresa
            let tag=null;let tagCls='dtag';
            if(dd?.status==='dayoff'){tag='FOLGA';tagCls='dtag tag-dayoff';}
            else if(dd?.status==='available'){tag='S/SV';tagCls='dtag tag-available';}
            else if(dd?.status==='worked'){
              const co=companies.find(x=>x.id===dd.companyId);
              if(dd.clientId){
                const cl=(co?.clients||[]).find(x=>x.id===dd.clientId);
                tag=cl?(cl.name.split(' ')[0]).slice(0,5).toUpperCase():(co?.name||'').slice(0,3).toUpperCase();
              } else {
                tag=(co?.name||'').slice(0,3).toUpperCase();
              }
            }
            return(
              <div key={cell.k} className={cls}
                style={{
                  ...(color?{backgroundColor:color}:{}),
                  ...(isQp?{outline:'2.5px solid var(--primary)',outlineOffset:'2px'}:{})
                }}
                onClick={()=>handleDayClick(cell.k,dd)}>
                <span className="dnum">{cell.d}</span>
                {tag&&<span className={tagCls}>{tag}</span>}
              </div>
            );
          })}
        </div>
      </div>

      {/* -- Quick Pick Modal -- */}
      {qp&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setQp(null)}>
          <div className="modal">
            <div className="mhead">
              <div>
                <div className="msub">
                  {qp.step==='view'?'Registro do dia':qp.step==='co'?'Registrar dia':'Selecione o Cliente'}
                </div>
                <div className="mtitle">{fmtD(qp.key)}</div>
              </div>
              <button className="mclose" onClick={()=>setQp(null)}>x</button>
            </div>

            {/* Step 0 - Visualizar registro existente */}
            {qp.step==='view'&&qp.dayData&&(()=>{
              const dd=qp.dayData;
              const co=companies.find(c=>c.id===dd.companyId);
              const cl=(co?.clients||[]).find(c=>c.id===dd.clientId);
              const isWorked=dd.status==='worked';
              const isDayoff=dd.status==='dayoff';
              const color=isWorked?(cl?.color||co?.color||'var(--primary)'):'#64748B';
              return(
                <div style={{display:'flex',flexDirection:'column',gap:12}}>
                  {/* Card resumo */}
                  <div style={{borderRadius:14,background:color,padding:'18px 16px',
                    boxShadow:`0 4px 16px ${color}44`}}>
                    <div style={{fontSize:28,marginBottom:8,textAlign:'center'}}>
                      {isWorked?<svg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' strokeWidth='2'><rect x='2' y='7' width='20' height='14' rx='3'/><path d='M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2'/></svg>:isDayoff?<svg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' strokeWidth='2'><path d='M18 8h1a4 4 0 0 1 0 8h-1'/><path d='M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z'/><line x1='6' y1='1' x2='6' y2='4'/><line x1='10' y1='1' x2='10' y2='4'/><line x1='14' y1='1' x2='14' y2='4'/></svg>:''}
                    </div>
                    <div style={{fontSize:18,fontWeight:900,color:'#fff',textAlign:'center'}}>
                      {isWorked?(cl?.name||co?.name||'Dia trabalhado'):isDayoff?'Folga':'Sem Serviço'}
                    </div>
                    {isWorked&&co&&(
                      <div style={{fontSize:13,color:'rgba(255,255,255,.75)',textAlign:'center',marginTop:4}}>
                        {co.name}
                      </div>

                    {isWorked&&dd.rate>0&&(
                      <div style={{fontSize:16,fontWeight:800,color:'#fff',textAlign:'center',marginTop:8}}>
                        {fmtM(dd.rate)}
                      </div>

                    {isWorked&&dd.location&&(
                      <div style={{fontSize:12,color:'rgba(255,255,255,.7)',textAlign:'center',marginTop:4}}>
                        {dd.location}
                      </div>

                  </div>

                  {/* Botões */}
                  <button onClick={()=>setQp(p=>({...p,step:'co',coId:null,dayData:null}))} style={{
                    borderRadius:14,padding:'14px',border:'2px solid var(--primary)',
                    background:'none',color:'var(--primary)',fontFamily:'var(--font)',
                    fontSize:15,fontWeight:800,cursor:'pointer'}}>
                     Trocar registro
                  </button>
                  <button onClick={()=>{onQuickSave(qp.key,null);setQp(null);}} style={{
                    borderRadius:14,padding:'14px',border:'none',
                    background:'var(--brand-glow)',color:'var(--brand)',fontFamily:'var(--font)',
                    fontSize:15,fontWeight:800,cursor:'pointer'}}>
                    Apagar registro
                  </button>
                </div>
              );
            })()}

            {/* Step 1 - Status + Empresas */}
            {qp.step==='co'&&(
              <div style={{display:'flex',flexDirection:'column',gap:14}}>

                {/* Folga e Sem Serviço */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                  <button onClick={()=>{onQuickSave(qp.key,{status:'dayoff',companyId:null,clientId:null,clientName:'',location:'',tipo:'',quantidade:1,rate:0});setQp(null);}} style={{
                    border:'none',borderRadius:14,padding:'18px 12px',cursor:'pointer',
                    background:'linear-gradient(135deg,#64748B,#94A3B8)',
                    display:'flex',flexDirection:'column',alignItems:'center',gap:8,

                    <span style={{fontSize:28}}></span>

                  <button onClick={()=>{onQuickSave(qp.key,{status:'available',companyId:null,clientId:null,clientName:'',location:'',tipo:'',quantidade:1,rate:0});setQp(null);}} style={{

                      <div style={{width:46,height:46,borderRadius:12,
                        background:'rgba(255,255,255,.25)',flexShrink:0,
                        display:'flex',alignItems:'center',justifyContent:'center',
                        color:'#fff',fontWeight:900,fontSize:16}}>
                        {co.name.slice(0,2).toUpperCase()}
                      </div>
                      <div style={{flex:1,textAlign:'left'}}>
                        <div style={{fontSize:15,fontWeight:800,color:'#fff'}}>{co.name}</div>
                        <div style={{fontSize:12,color:'rgba(255,255,255,.75)',marginTop:2}}>

                {/* Card empresa */}

                      <div style={{fontSize:11,color:'rgba(255,255,255,.75)',marginTop:2}}>Selecione o cliente</div>
                    </div>
                    <button onClick={()=>setQp(p=>({...p,step:'co',coId:null}))} style={{

                </div>

function UserProfileModal({user,onSave,onClose}){
  const[form,setForm]=useState({name:'',cnpj:'',cpf:'',phone:'',email:'',pixKey:'',pixKeyType:'cnpj',city:'',...user});
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const save=()=>{if(!form.name.trim()){alert('Informe seu nome');return;}onSave(form);};
  const pixPlaceholders={cnpj:'00.000.000/0001-00 (mesmo do campo CNPJ)',cpf:'000.000.000-00 (mesmo do campo CPF)',phone:'(11) 99999-9999',email:'seu@email.com',aleatoria:'chave aleatória (UUID)'};

  // -- Auto-preenche a chave PIX a partir do campo correspondente ------
  // (CNPJ/CPF/Telefone/E-mail já digitados acima) sempre que o tipo de
  // chave for um desses e o campo de origem mudar. "Aleatória" fica manual.
  const setCnpj=v=>setForm(p=>({...p,cnpj:v,pixKey:p.pixKeyType==='cnpj'?v:p.pixKey}));
  const setCpf=v=>setForm(p=>({...p,cpf:v,pixKey:p.pixKeyType==='cpf'?v:p.pixKey}));
  const setPhone=v=>setForm(p=>({...p,phone:v,pixKey:p.pixKeyType==='phone'?v:p.pixKey}));
  const setEmail=v=>setForm(p=>({...p,email:v,pixKey:p.pixKeyType==='email'?v:p.pixKey}));
  const setPixKeyType=type=>setForm(p=>({...p,pixKeyType:type,
    pixKey:type==='aleatoria'?'':({cnpj:p.cnpj,cpf:p.cpf,phone:p.phone,email:p.email}[type]||'')}));
  const pixAuto=form.pixKeyType!=='aleatoria';

  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="mhead">
          <div><div className="msub">Meu Perfil</div><div className="mtitle">Dados Profissionais</div></div>
          <button className="mclose" onClick={onClose}>x</button>
        </div>
        <div className="fg"><label className="fl">Nome Completo *</label>
          <input className="fi" value={form.name} onChange={e=>f('name',e.target.value)} placeholder="Ex: João da Silva"/></div>
        <div className="fg"><label className="fl">CNPJ</label>
          <input className="fi" value={form.cnpj} onChange={e=>setCnpj(e.target.value)} placeholder="00.000.000/0001-00"/></div>
        <div className="fg"><label className="fl">CPF</label>
          <input className="fi" value={form.cpf} onChange={e=>setCpf(e.target.value)} placeholder="000.000.000-00"/></div>
        <div className="fg"><label className="fl">Telefone</label>
          <input className="fi" value={form.phone} onChange={e=>setPhone(e.target.value)} placeholder="(11) 99999-9999"/></div>
        <div className="fg"><label className="fl">E-mail</label>
          <input className="fi" value={form.email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com"/></div>
        <div className="fg"><label className="fl">Cidade (pro PIX)</label>
          <input className="fi" value={form.city} onChange={e=>f('city',e.target.value)} placeholder="Ex: Francisco Morato"/></div>
        <div className="fg"><label className="fl">Tipo de Chave PIX</label>
          <select className="fi" value={form.pixKeyType} onChange={e=>setPixKeyType(e.target.value)}>
            <option value="cnpj">CNPJ</option>
            <option value="cpf">CPF</option>
            <option value="phone">Telefone</option>
            <option value="email">E-mail</option>
            <option value="aleatoria">Chave aleatória</option>
          </select></div>
        <div className="fg"><label className="fl">Chave PIX *{pixAuto&&' (preenchida automaticamente)'}</label>
          <input className="fi" value={form.pixKey} onChange={e=>f('pixKey',e.target.value)}
            placeholder={pixPlaceholders[form.pixKeyType]||'Sua chave PIX'}/>
          <div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>
            {pixAuto
              ? 'Puxada automaticamente do campo correspondente acima — pode editar aqui se o formato cadastrado no banco for diferente.'
              : 'Chave aleatória não é gerada pelo app — cole aqui a chave que o seu banco criou.'}
            {' '}Se deixar em branco, o relatório usa o CNPJ como chave (padrão comum de MEI).
          </div>
        </div>
        <button className="btn btn-p" onClick={save} style={{marginTop:14}}>OK Salvar perfil</button>
      </div>
    </div>
  );
}

function ReportView({workDays,companies,userName,user}){
  const firstOfMo=TODAY.slice(0,7)+'-01';
  const[coId,setCoId]=useState('all');
  const[from,setFrom]=useState(firstOfMo);
  const[to,setTo]=useState(TODAY);
  const[busy,setBusy]=useState(false);

  const rows=useMemo(()=>
    Object.entries(workDays)
      .filter(([k,v])=>v.status==='worked'&&k>=from&&k<=to&&(coId==='all'||v.companyId===coId))
      .sort(([a],[b])=>a.localeCompare(b))
      .map(([k,v])=>{
        const co=companies.find(c=>c.id===v.companyId);
        const cl=(co?.clients||[]).find(c=>c.id===v.clientId);
        return{...v,dateKey:k,
          coName:co?.name||'-',
          coColor:co?.color||'#888',
          clientName:v.clientName||'-',
          clientColor:cl?.color||co?.color||'#888',
          clientId:v.clientId||null,
          tipo:v.tipo||'Diária',quantidade:v.quantidade||1,
          hours:diffH(v.startTime,v.endTime)};
      })
  ,[workDays,from,to,coId]);

  const total=rows.reduce((s,r)=>s+(Number(r.rate)||0),0);
  const totalH=rows.reduce((s,r)=>s+r.hours,0);

  // Breakdown per company
  const breakdown=useMemo(()=>{
    const map={};
    rows.forEach(r=>{if(!map[r.companyId])map[r.companyId]={name:r.coName,color:r.coColor,total:0,days:0};
      map[r.companyId].total+=Number(r.rate)||0;map[r.companyId].days++;});
    return Object.values(map).sort((a,b)=>b.total-a.total);
  },[rows]);
  const maxTotal=breakdown[0]?.total||1;

  const genPDF=()=>{
    if(!rows.length){alert('Nenhum dia trabalhado no período selecionado.');return;}
    if(typeof window.jspdf==='undefined'||!window.jspdf.jsPDF){
      alert(' Biblioteca jsPDF não carregada.\n\nVerifique sua conexão e recarregue.');return;
    }
    setBusy(true);
    try{
      const{jsPDF}=window.jspdf;
      const doc=new jsPDF('p','mm','a4');
      const pw=doc.internal.pageSize.getWidth();
      const ph=doc.internal.pageSize.getHeight();

      // -- Helpers ---------------------------------------------------
      const h2r=hex=>{const v=hex.replace('#','');return{r:parseInt(v.slice(0,2),16),g:parseInt(v.slice(2,4),16),b:parseInt(v.slice(4,6),16)};};
      const hasContact=!!(user?.phone||user?.email);
      const uniqueClients=new Set(rows.filter(r=>r.clientId).map(r=>r.clientId)).size||new Set(rows.map(r=>r.companyId)).size;
      const selCo=coId==='all'?null:companies.find(c=>c.id===coId);
      const now2=new Date();
      const reportNum=`REL-${now2.getFullYear()}${String(now2.getMonth()+1).padStart(2,'0')}${String(now2.getDate()).padStart(2,'0')}-${String(now2.getHours()).padStart(2,'0')}${String(now2.getMinutes()).padStart(2,'0')}`;

      // -- QR Code helper (usa qrcode-generator, fallback placeholder) -
      const drawQR=(doc,text,x,y,size)=>{
        try{
          if(typeof qrcode==='undefined')throw new Error('no lib');
          const qr=qrcode(0,'M');qr.addData(text);qr.make();
          const mc=qr.getModuleCount(),cs=size/mc;
          doc.setFillColor(255,255,255);doc.rect(x-1.5,y-1.5,size+3,size+3,'F');
          doc.setFillColor(0,0,0);
          for(let r=0;r<mc;r++)for(let c=0;c<mc;c++)
            if(qr.isDark(r,c))doc.rect(x+c*cs,y+r*cs,cs+0.15,cs+0.15,'F');
        }catch(e){
          // Placeholder visual com padrão QR
          const p=size/7;
          doc.setFillColor(255,255,255);doc.rect(x-1.5,y-1.5,size+3,size+3,'F');
          doc.setFillColor(0,0,0);
          [[0,0],[4,0],[0,4]].forEach(([cx,cy])=>{
            doc.rect(x+cx*p,y+cy*p,p*3,p*3,'F');
            doc.setFillColor(255,255,255);doc.rect(x+cx*p+p*.5,y+cy*p+p*.5,p*2,p*2,'F');
            doc.setFillColor(0,0,0);doc.rect(x+cx*p+p,y+cy*p+p,p,p,'F');
          });
          doc.setFillColor(0,0,0);
          for(let i=0;i<5;i++)for(let j=0;j<5;j++)
            if((i+j)%2===0)doc.rect(x+p*(2+i*.6),y+p*(2+j*.6),p*.5,p*.5,'F');
        }
      };

      // ==============================================================
      // NOVO LAYOUT — estilo "documento oficial" (aprovado 20/07/2026)
      // ==============================================================
      const MARGIN=15, RIGHT=pw-MARGIN;
      const DARK=[34,34,34], GRAY=[85,85,85], LINE=[190,190,190];
      const GREEN=[30,122,52], GREEN_BG=[232,245,234];

      // -- Cabeçalho ---------------------------------------------------
      doc.setFillColor(30,122,52);doc.circle(22,10,6,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(255,255,255);
      doc.text('M',22,12,{align:'center'});

      doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...DARK);
      doc.text('MEI Agenda',32,10);
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...GRAY);
      doc.text('Gestão Prática para Prestadores de Serviços',32,15);

      doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...DARK);
      doc.text('Relatório de Prestação de Serviços',RIGHT,12,{align:'right'});

      doc.setDrawColor(...LINE);doc.setLineWidth(0.3);
      doc.line(MARGIN,20,RIGHT,20);

      // -- Helper: caixa com label + valor -----------------------------
      const box=(x,y,w,h,label,val,opts={})=>{
        doc.setDrawColor(...(opts.stroke||LINE));doc.setLineWidth(0.3);
        if(opts.fill){doc.setFillColor(...opts.fill);doc.roundedRect(x,y,w,h,1.2,1.2,'FD');}
        else doc.roundedRect(x,y,w,h,1.2,1.2,'S');
        doc.setFont('helvetica','bold');doc.setFontSize(6);
        doc.setTextColor(...(opts.labelColor||GRAY));
        doc.text(label,x+3,y+4.5);
        doc.setFont('helvetica','bold');doc.setFontSize(opts.valSize||9.5);
        doc.setTextColor(...(opts.valColor||DARK));
        doc.text(String(val),x+3,y+h-3.5);
      };

      // -- Linha 1: CNPJ | Prestador | Data de emissão -----------------
      let y=24;
      const hoje=new Date();
      const hojeStr=`${String(hoje.getDate()).padStart(2,'0')}/${String(hoje.getMonth()+1).padStart(2,'0')}/${hoje.getFullYear()}`;
      // -- Constantes do rodapé fixo (reservadas antes de montar a tabela) --
      const FOOTER_H=13;      // rodapé simples (sem cor)
      const PIX_H=28;         // bloco do PIX (título+linhas+QR) — ajustado pra fechar o vão ao redor do QR
      const RESERVED_BOTTOM=FOOTER_H+PIX_H+4; // espaço sempre reservado no fim de cada página

      box(MARGIN,y,55,12,'CNPJ',user?.cnpj||'—');
      box(MARGIN+55+3,y,78,12,'PRESTADOR',(user?.name||userName||'—').toUpperCase());
      box(MARGIN+55+3+78+3,y,RIGHT-(MARGIN+55+3+78+3),12,'DATA DE EMISSÃO',hojeStr,
        {fill:GREEN_BG,stroke:GREEN,labelColor:GREEN,valColor:GREEN});

      // -- Linha 2: Telefone | Período | E-mail -------------------------
      y+=16;
      const periodoStr=`${fmtD(from)} a ${fmtD(to)}`;
      box(MARGIN,y,55,12,'TELEFONE',user?.phone||'—',{valSize:8.5});
      box(MARGIN+55+3,y,45,12,'PERÍODO DE APURAÇÃO',periodoStr,{valSize:8.5});
      box(MARGIN+55+3+45+3,y,RIGHT-(MARGIN+55+3+45+3),12,'E-MAIL',user?.email||'—',{valSize:8.5});

      // -- Faixa resumo: Dias | Clientes | Valor Total -------------------
      y+=20;
      const stripW=(RIGHT-MARGIN-2*6)/3;
      const summary3=[
        {label:'DIAS TRABALHADOS',val:String(rows.length),color:DARK},
        {label:'CLIENTES ATENDIDOS',val:String(uniqueClients),color:DARK},
        {label:'VALOR TOTAL',val:fmtM(total),color:GREEN},
      ];
      summary3.forEach((s,i)=>{
        const bx=MARGIN+i*(stripW+6);
        doc.setFillColor(244,244,244);doc.setDrawColor(...LINE);doc.setLineWidth(0.3);
        doc.roundedRect(bx,y,stripW,16,1.2,1.2,'FD');
        doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...GRAY);
        doc.text(s.label,bx+stripW/2,y+6,{align:'center'});
        doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(...s.color);
        doc.text(s.val,bx+stripW/2,y+13,{align:'center'});
      });

      // -- Barra título da tabela ----------------------------------------
      y+=22;
      doc.setFillColor(43,43,43);doc.rect(MARGIN,y,RIGHT-MARGIN,7,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(255,255,255);
      doc.text('COMPOSIÇÃO DO RELATÓRIO — DIAS TRABALHADOS',MARGIN+2,y+4.8);

      // ==============================================================
      // TABELA
      // ==============================================================
      const tableStartY=y+7;
      const tableData=rows.map(r=>[
        fmtD(r.dateKey),r.coName,r.clientName||'-',r.location||'-',
        r.tipo||'Diária',fmtM(r.rate)
      ]);

      if(typeof doc.autoTable==='function'){
        doc.autoTable({
          startY:tableStartY,
          head:[['Data','Empresa','Cliente','Local','Tipo','Valor']],
          body:tableData,
          showHead:'firstPage',
          theme:'plain',styles:{lineWidth:0},
          headStyles:{fillColor:[255,255,255],textColor:[85,85,85],fontStyle:'bold',fontSize:7,cellPadding:{top:2.5,right:4,bottom:1,left:4}},
          bodyStyles:{fontSize:7.5,cellPadding:{top:2.2,right:4,bottom:2.2,left:4},textColor:[34,34,34]},
          alternateRowStyles:{fillColor:[247,247,247]},
          columnStyles:{
            0:{cellWidth:26,cellPadding:{top:2.2,right:4,bottom:2.2,left:5}},
            1:{cellWidth:38,cellPadding:{top:2.2,right:4,bottom:2.2,left:5}},
            2:{cellWidth:32,cellPadding:{top:2.2,right:4,bottom:2.2,left:5}},3:{cellWidth:36},
            4:{cellWidth:26},
            5:{cellWidth:24,halign:'right',fontStyle:'bold'}
          },
          margin:{left:MARGIN,right:MARGIN,bottom:RESERVED_BOTTOM}
        });
      } else {
        let ty=tableStartY+8;
        doc.setFontSize(8);doc.setFont('helvetica','bold');
        doc.setFillColor(43,43,43);doc.rect(MARGIN,ty-5,RIGHT-MARGIN,8,'F');
        doc.setTextColor(255,255,255);
        doc.text('Data',MARGIN+4,ty);doc.text('Empresa',46,ty);doc.text('Cliente',82,ty);
        doc.text('Local',114,ty);doc.text('Tipo',148,ty);doc.text('Valor',RIGHT-2,ty,{align:'right'});
        ty+=10;doc.setFont('helvetica','normal');
        rows.forEach((r,i)=>{
          const bg=i%2===1?[247,247,247]:[255,255,255];
          doc.setFillColor(bg[0],bg[1],bg[2]);doc.rect(MARGIN,ty-4,RIGHT-MARGIN,8,'F');
          doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...DARK);
          doc.text(fmtD(r.dateKey),MARGIN+4,ty);
          doc.text((r.coName||'').slice(0,10),46,ty);
          doc.text((r.clientName||'-').slice(0,12),82,ty);
          doc.text((r.location||'-').slice(0,12),116,ty);
          doc.text(r.tipo||'Diária',148,ty);
          doc.text(fmtM(r.rate),RIGHT-2,ty,{align:'right'});
          ty+=7;if(ty>ph-RESERVED_BOTTOM-6){doc.addPage();ty=20;}
        });
        doc.lastAutoTable={finalY:ty};
      }

      // -- Linha total ----------------------------------------------------
      let finalY=(doc.lastAutoTable&&doc.lastAutoTable.finalY)?doc.lastAutoTable.finalY:tableStartY+10;
      doc.setDrawColor(...LINE);doc.setLineWidth(0.3);
      doc.line(MARGIN,finalY+2,RIGHT,finalY+2);
      doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...DARK);
      doc.text('TOTAL',148,finalY+7);
      doc.text(fmtM(total),RIGHT-2,finalY+7,{align:'right'});

      // ==============================================================
      // FAIXA PIX — fixa no rodapé da última página
      // ==============================================================
      const pageCount=doc.internal.getNumberOfPages();
      doc.setPage(pageCount);

      // -- Posição do bloco PIX: SEMPRE fixa no rodapé da página, -------
      // independente de quantos dias tiver na tabela ---------------------
      const pixY=ph-RESERVED_BOTTOM+2;
      const footerY0=ph-FOOTER_H; // linha fixa do rodapé (mesma em todas as páginas)

      const pixKeyRaw=(user?.pixKey||user?.cnpj||'').trim();
      // O tipo só vale se a chave veio do campo pixKey; no fallback pro
      // CNPJ, o tipo tem que ser tratado como CNPJ mesmo que o usuário
      // tenha selecionado outro tipo no formulário.
      const pixKeyType=user?.pixKey?(user?.pixKeyType||'cnpj'):'cnpj';
      let pixKey;
      if(pixKeyType==='email'){
        pixKey=pixKeyRaw; // e-mail precisa manter o ponto — não sanitizar
      }else if(pixKeyType==='aleatoria'){
        pixKey=pixKeyRaw; // chave aleatória é um UUID — precisa manter os traços
      }else if(pixKeyType==='phone'){
        let digits=pixKeyRaw.replace(/\D/g,'');
        if(digits.length===10||digits.length===11)digits='55'+digits; // adiciona DDI se faltar
        pixKey='+'+digits;
      }else{
        pixKey=pixKeyRaw.replace(/\D/g,''); // CNPJ ou CPF: só dígitos
      }

      doc.setDrawColor(...LINE);doc.setLineWidth(0.3);
      doc.line(MARGIN,pixY,RIGHT,pixY);
      doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(...DARK);
      doc.text('Pagamento via PIX',MARGIN,pixY+7);

      if(pixKey){
        doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...GRAY);
        doc.text(`Chave: ${pixKeyRaw}`,MARGIN,pixY+13);
        doc.text(`Beneficiário: ${(user?.name||userName||'').toUpperCase()}`,MARGIN,pixY+18);
        doc.text(`Valor: ${fmtM(total)}`,MARGIN,pixY+23);

        // -- Sanitização (padrão BR Code / EMV exige texto sem acento -
        // e sem caracteres especiais nos campos 59/60/62, senão o banco
        // recusa o QR mesmo ele "parecendo" válido) -------------------
        const stripAccents=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        const alnumOnly=s=>stripAccents(s).toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim();

        // -- Payload PIX (BR Code / EMV — Banco Central) --------------
        const crc16=(payload)=>{
          let result=0xFFFF;
          for(let i=0;i<payload.length;i++){
            result^=(payload.charCodeAt(i)<<8);
            for(let b=0;b<8;b++){
              result=(result&0x8000)?((result<<1)^0x1021)&0xFFFF:(result<<1)&0xFFFF;
            }
          }
          return result.toString(16).toUpperCase().padStart(4,'0');
        };
        const emv=(id,val)=>`${id}${String(val.length).padStart(2,'0')}${val}`;
        const nome=alnumOnly(user?.name||userName||'MEI').slice(0,25)||'MEI';
        const cidade=alnumOnly(user?.city||'BRASIL').slice(0,15)||'BRASIL';
        const txid=(reportNum.replace(/[^A-Za-z0-9]/g,'')).slice(0,25)||'MEIAGENDA';
        const merchant=emv('00','br.gov.bcb.pix')+emv('01',pixKey);
        const payloadBase=emv('00','01')+emv('01','11')+emv('26',merchant)+emv('52','0000')+
          emv('53','986')+emv('54',total.toFixed(2))+emv('58','BR')+emv('59',nome)+emv('60',cidade)+
          emv('62',emv('05',txid))+'6304';
        const pixPayload=payloadBase+crc16(payloadBase);

        // -- QR do tamanho fixo do protótipo, centralizado verticalmente --
        // no bloco (respiro igual entre a linha "Pagamento via PIX" e o --
        // topo do QR, e entre a base do QR e a linha do rodapé) ----------
        const blockH=footerY0-pixY;      // espaço total disponível no bloco
        const qrSize=26; // tamanho fixo, igual ao protótipo de referência aprovado
        const qrY=pixY+(blockH-qrSize)/2;

        drawQR(doc,pixPayload,RIGHT-qrSize,qrY,qrSize);
      } else {
        doc.setFont('helvetica','italic');doc.setFontSize(7.5);doc.setTextColor(180,60,60);
        doc.text('Configure sua chave PIX em Configurações para habilitar o QR Code de pagamento.',MARGIN,pixY+13);
      }

      // ==============================================================
      // RODAPÉ — simples, sem cor, em todas as páginas
      // ==============================================================
      for(let p=1;p<=pageCount;p++){
        doc.setPage(p);
        const footerY=ph-FOOTER_H;
        doc.setDrawColor(...LINE);doc.setLineWidth(0.3);
        doc.line(MARGIN,footerY,RIGHT,footerY);
        doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...GRAY);
        doc.text(`Gerado em ${fmtD(TODAY)} as ${String(now2.getHours()).padStart(2,'0')}:${String(now2.getMinutes()).padStart(2,'0')}`,MARGIN,footerY+6);
        doc.setFont('helvetica','bold');doc.setFontSize(6.5);
        doc.text('Gestão Prática para Prestadores de Serviços',pw/2,footerY+6,{align:'center'});
        const rightInfo=(user?.cnpj)?`${user?.name||userName} | ${user.cnpj}`:(user?.name||userName||'MEI');
        doc.text(rightInfo,RIGHT,footerY+6,{align:'right'});
        if(pageCount>1)doc.text(`${p}/${pageCount}`,pw/2,footerY+10,{align:'center'});
      }
      doc.setPage(pageCount);

      // -- Download --------------------------------------------------
      const slug=(selCo?.name||'todas').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
      const filename=`${reportNum}-${slug}.pdf`;
      try{
        const blob=doc.output('blob');
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download=filename;a.style.display='none';
        document.body.appendChild(a);a.click();
        setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},3000);
      }catch(dlErr){
        const dataUri=doc.output('datauristring');
        const a=document.createElement('a');
        a.href=dataUri;a.download=filename;a.style.display='none';
        document.body.appendChild(a);a.click();
        setTimeout(()=>document.body.removeChild(a),2000);
      }
      setBusy(false);
    }catch(err){
      console.error('PDF error:',err);
      alert('Erro ao gerar PDF:\n'+err.message);
      setBusy(false);
    }
  };

  return(
    <div className="tabwrap">
      <div className="section-h">
        <div className="sec-label">Gerar</div>
        <div className="sec-h2">Relatório PDF</div>
      </div>

      <div className="rcard">
        <div className="rcard-title">Filtros</div>
        <div className="fg">
          <label className="fl">Empresa</label>
          <select className="fi" value={coId} onChange={e=>setCoId(e.target.value)}>
            <option value="all">Todas as Empresas</option>
            {companies.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
        <div className="row2">
          <div className="fg"><label className="fl">De</label>
            <input className="fi" type="date" value={from} onChange={e=>setFrom(e.target.value)}/></div>
          <div className="fg"><label className="fl">Até</label>
            <input className="fi" type="date" value={to} onChange={e=>setTo(e.target.value)}/></div>
        </div>
      </div>

      {rows.length>0?(<>
        <div className="rcard">
          <div className="rcard-title">Prévia - {rows.length} dia(s)</div>
          <div style={{overflowX:'auto'}}>
            <table className="ptable">
              <thead><tr><th>Data</th><th>Empresa</th><th>Cliente</th><th>Local</th><th>Tipo</th><th style={{textAlign:'right'}}>Valor</th></tr></thead>
              <tbody>
                {rows.map(r=>(
                  <tr key={r.dateKey}>
                    <td style={{whiteSpace:'nowrap'}}>{fmtD(r.dateKey)}</td>
                    <td><span style={{display:'inline-flex',alignItems:'center',gap:5}}>
                      <span style={{width:8,height:8,borderRadius:2,background:r.coColor,flexShrink:0}}/>
                      {r.coName}
                    </span></td>
                    <td style={{color:'var(--muted)'}}>{r.clientName||'-'}</td>
                    <td style={{color:'var(--muted)'}}>{r.location||'-'}</td>
                    <td style={{whiteSpace:'nowrap',color:'var(--muted)'}}>{r.tipo||'Diária'}</td>
                    <td style={{textAlign:'right',fontWeight:700,color:'var(--primary)'}}>{fmtM(r.rate)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {breakdown.length>1&&(<>
            <div className="divider"/>
            <div className="sec-mini">Por empresa</div>
            <div className="breakdown">
              {breakdown.map(b=>(
                <div key={b.name} className="bk-row">
                  <div className="bk-label" style={{color:b.color}}>{b.name.split(' ')[0]}</div>
                  <div className="bk-bar-wrap">
                    <div className="bk-bar" style={{width:`${(b.total/maxTotal)*100}%`,background:b.color}}/>
                  </div>
                  <div className="bk-val">{fmtM(b.total,true)} <span style={{color:'var(--muted)',fontWeight:400}}>({b.days}d)</span></div>
                </div>
              ))}
            </div>
          </>)}

          <div className="divider"/>
          <div className="sumline">
            <span style={{color:'var(--muted)',fontWeight:600}}>Total a receber</span>
            <span className="sumtotal">{fmtM(total)}</span>
          </div>
        </div>
      </>):(
        <div className="rcard empty-state">
          <span className="empty-icon"></span>
          <p style={{fontWeight:700,fontSize:15}}>Nenhum dia encontrado</p>
          <p style={{fontSize:13,marginTop:4}}>Ajuste os filtros ou registre dias no calendário</p>
        </div>
      )}

      <button className="btn btn-p" disabled={!rows.length||busy} onClick={genPDF}>
        {busy?' Gerando PDF...':' Gerar e Baixar PDF'}
      </button>
    </div>
  );
}

/* -- HomeView ----------------------------------------------------- */
function HomeView({workDays,companies,onGoCalendar}){
  const[hideMes,setHideMes]=useState(false);
  const[hideAno,setHideAno]=useState(false);
  const trackRef=useRef(null);
  const[slide,setSlide]=useState(0);
  const[transitioning,setTransitioning]=useState(true);
  const timerRef=useRef(null);
  const N=PROFISSOES.length;
  // slides = [last, ...all, first] para loop infinito
  const slides=[PROFISSOES[N-1],...PROFISSOES,PROFISSOES[0]];
  const[pos,setPos]=useState(1); // começa no índice 1 (primeiro real)

  const startTimer=()=>{
    clearInterval(timerRef.current);
    timerRef.current=setInterval(()=>setPos(p=>p+1),3200);
  };

  useEffect(()=>{startTimer();return()=>clearInterval(timerRef.current);},[]);

  useEffect(()=>{
    // quando chega no clone do primeiro (pos === N+1), salta para o real sem animação
    if(pos===N+1){
      const t=setTimeout(()=>{
        setTransitioning(false);
        setPos(1);
      },400);
      return()=>clearTimeout(t);
    }
    // quando chega no clone do último (pos === 0), salta para o real sem animação
    if(pos===0){
      const t=setTimeout(()=>{
        setTransitioning(false);
        setPos(N);
      },400);
      return()=>clearTimeout(t);
    }
    setTransitioning(true);
    setSlide((pos-1+N)%N);
  },[pos]);

  // reativa transição após salto invisível
  useEffect(()=>{
    if(!transitioning){
      const t=setTimeout(()=>setTransitioning(true),50);
      return()=>clearTimeout(t);
    }
  },[transitioning]);

  const goSlide=i=>{
    clearInterval(timerRef.current);
    setTransitioning(true);
    setPos(i+1);
    setSlide(i);
    startTimer();
  };

  const now=new Date();
  const yr=now.getFullYear(),mo=now.getMonth();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  let mesWorked=0,mesReceita=0,mesFolgas=0,mesSemServ=0;
  for(let d=1;d<=daysInMonth;d++){
    const k=bkey(yr,mo,d);const dd=workDays[k];
    if(dd?.status==='worked'){mesWorked++;mesReceita+=Number(dd.rate)||0;}
    if(dd?.status==='dayoff')mesFolgas++;
    if(dd?.status==='available')mesSemServ++;
  }
  // Empresas ativas este mês
  const empresasAtivas=useMemo(()=>{
    const coIds=new Set();
    for(let d=1;d<=daysInMonth;d++){
      const k=bkey(yr,mo,d);const dd=workDays[k];
      if(dd?.status==='worked'&&dd.companyId) coIds.add(dd.companyId);
    }
    return (companies||[]).filter(c=>coIds.has(c.id)).map(c=>{
      let dias=0,receita=0;
      for(let d=1;d<=daysInMonth;d++){
        const k=bkey(yr,mo,d);const dd=workDays[k];
        if(dd?.status==='worked'&&dd.companyId===c.id){dias++;receita+=Number(dd.rate)||0;}
      }
      return{...c,dias,receita};
    }).sort((a,b)=>b.receita-a.receita);
  },[workDays,companies,yr,mo]);

  let anoWorked=0,anoReceita=0,anoFolgas=0,anoSemServ=0;
  for(let m=0;m<12;m++){
    const dias=new Date(yr,m+1,0).getDate();
    for(let d=1;d<=dias;d++){
      const k=bkey(yr,m,d);const dd=workDays[k];
      if(dd?.status==='worked'){anoWorked++;anoReceita+=Number(dd.rate)||0;}
      if(dd?.status==='dayoff')anoFolgas++;
      if(dd?.status==='available')anoSemServ++;
    }
  }

  return(
    <div className="home-page">
      {/* Faixa reservada */}
      <div className="home-top-strip"/>

      {/* Cards */}

          </div>
          {/* Cards este mês */}
          <div className="home-cards" style={{gridTemplateColumns:'1fr 1fr 1fr',marginBottom:10}}>

              <div className="home-card-lbl">Trabalhados</div>
            </div>
            <div className="home-card">
              <div className="home-card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></div>
              <div className="home-card-val" style={{color:'var(--mid)'}}>{mesFolgas}</div>
              <div className="home-card-lbl">Folgas</div>
            </div>
            <div className="home-card">
              <div className="home-card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="6" y1="14" x2="18" y2="22"/></svg></div>
              <div className="home-card-val" style={{color:'var(--mid)'}}>{mesSemServ}</div>
              <div className="home-card-lbl">Sem serviço</div>
            </div>
          </div>
          {/* Card valor mensal */}
          <div className="home-card" style={{display:'flex',alignItems:'center',
            justifyContent:'space-between',padding:'14px 16px',marginBottom:4}}>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              <div>
                <div className="home-card-lbl" style={{marginTop:0}}>A receber este mês</div>
                <div className="home-card-val" style={{fontSize:20,marginTop:3,color:'var(--brand)'}}>
                  {hideMes?'R$ ....':fmtM(mesReceita)}
                </div>
              </div>
            </div>
            <button onClick={()=>setHideMes(p=>!p)} style={{background:'none',border:'none',
              cursor:'pointer',padding:6,display:'flex',alignItems:'center',color:'var(--muted)'}}>
              {hideMes
                ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
        </div>

        <div>
          <div className="home-section-title" style={{marginTop:16}}>Acumulado {yr}</div>
          {/* Cards ano */}
          <div className="home-cards" style={{gridTemplateColumns:'1fr 1fr 1fr',marginBottom:10}}>

              <div className="home-card-val" style={{color:'var(--text)'}}>{anoWorked}</div>
              <div className="home-card-lbl">Dias no ano</div>

            <div className="home-card">
              <div className="home-card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></div>

/* -- CalendarPage ------------------------------------------------- */
function CalendarPage({workDays,companies,onBack,onSaveDay,onDelDay,onDupDay,userName,user}){
  const[calTab,setCalTab]=useState('calendar');
  const[curDate,setCurDate]=useState(new Date());
  const[selDay,setSelDay]=useState(null);
  const[hideCalVal,setHideCalVal]=useState(false);
  const chgMo=d=>setCurDate(p=>new Date(p.getFullYear(),p.getMonth()+d,1));
  const goToday=()=>setCurDate(new Date());

  const CAL_TABS=[
    {id:'calendar',icon:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,label:'Novo Registro'},
    {id:'report',  icon:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="12" y2="16"/></svg>,label:'Relatório'},
    {id:'history', icon:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12 16,14"/></svg>,label:'Histórico'},
  ];

  return(
    <div className="cal-page">
      <div style={{background:'var(--primary)',padding:'10px 16px',flexShrink:0,display:'flex',alignItems:'center'}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,.15)',border:'none',
          color:'#fff',borderRadius:8,padding:'6px 14px',cursor:'pointer',fontSize:13,
          fontWeight:700,fontFamily:'var(--font)',display:'flex',alignItems:'center',gap:4}}>
          {'<'} Home
        </button>
      </div>

      <div className="cal-page-content">
        {calTab==='calendar'&&(
          <>
            <div style={{padding:'10px 16px 0',display:'flex',justifyContent:'flex-end'}}>
              {!(curDate.getFullYear()===nowDate.getFullYear()&&curDate.getMonth()===nowDate.getMonth())&&(
                <button onClick={goToday} style={{fontSize:12,fontWeight:700,color:'var(--primary)',
                  background:'none',border:'none',padding:'5px 4px',cursor:'pointer',
                  fontFamily:'var(--font)',textDecoration:'underline',textUnderlineOffset:3}}>
                  Mês atual
                </button>
              )}
            </div>
            <CalendarView workDays={workDays} companies={companies}
              currentDate={curDate} onMonthChange={chgMo} goToday={goToday}
              onDayClick={(k,d)=>setSelDay({k,d})} onQuickSave={(k,d)=>d===null?onDelDay(k):onSaveDay(k,d)}
              hideCalVal={hideCalVal} onToggleCalVal={()=>setHideCalVal(p=>!p)}/>
          </>
        )}
        {calTab==='report'&&<ReportView workDays={workDays} companies={companies} userName={userName} user={user}/>}
        {calTab==='history'&&(
          <HistoryView workDays={workDays} companies={companies}/>
        )}
      </div>

      <nav className="cal-bottom-nav">
        {CAL_TABS.map(t=>(
          <button key={t.id} className={`cal-btn ${calTab===t.id?'on':''}`} onClick={()=>setCalTab(t.id)}>
            <span className="cal-btn-icon">{t.icon}</span>{t.label}
          </button>
        ))}
      </nav>

      {selDay&&(
        <DayModal dayKey={selDay.k} dayData={selDay.d} companies={companies}
          onSave={d=>{onSaveDay(selDay.k,d);setSelDay(null);}}
          onDelete={()=>{onDelDay(selDay.k);setSelDay(null);}}
          onDuplicate={(tk,data)=>{onDupDay(tk,data);setSelDay(null);}}
          onClose={()=>setSelDay(null)}/>
      )}
    </div>
  );
}

/* -- MeiPage ------------------------------------------------------ */
const LIMITE_MEI_PADRAO=169572;
function MeiPage({workDays,user}){
  const now=new Date();
  const yr=now.getFullYear();
  let receitaAno=0;
  for(let m=0;m<12;m++){
    const dias=new Date(yr,m+1,0).getDate();
    for(let d=1;d<=dias;d++){
      const k=bkey(yr,m,d);
      const dd=workDays[k];
      if(dd?.status==='worked') receitaAno+=Number(dd.rate)||0;
    }
  }
  const limiteMei=Number(user?.limiteMei)||LIMITE_MEI_PADRAO;
  const pct=Math.min((receitaAno/limiteMei)*100,100);
  const restante=Math.max(limiteMei-receitaAno,0);
  const barColor=pct>=90?'#EF4444':pct>=70?'#F59E0B':'var(--brand)';

  const obrigacoes=[
    {label:'DAS Mensal',desc:'Guia de pagamento mensal do MEI',dia:'Até dia 20 de cada mês',icon:'📋'},
    {label:'DASN-SIMEI',desc:'Declaração anual de faturamento',dia:'Até 31 de maio de cada ano',icon:'📄'},
    {label:'Nota Fiscal',desc:'Emita NF para serviços a PJ acima de R$ 6.000',dia:'Por operação',icon:'🧾'},
  ];

  return(
    <div style={{padding:'16px',overflowY:'auto',height:'100%',boxSizing:'border-box'}}>
      {/* Header */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:18,fontWeight:800,color:'var(--text)'}}>Área MEI</div>
        <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>Controle seu limite e obrigações</div>
      </div>

      {/* Card limite anual */}
      <div style={{background:'var(--surface)',borderRadius:16,padding:'18px 16px',
        boxShadow:'var(--sh)',marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}>
          <div>
            <div style={{fontSize:12,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:.5}}>
              Faturamento {yr}
            </div>
            <div style={{fontSize:26,fontWeight:900,color:'var(--brand)',marginTop:4,letterSpacing:-.5}}>
              {fmtM(receitaAno)}
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:11,color:'var(--muted)'}}>Limite MEI</div>
            <div style={{fontSize:14,fontWeight:800,color:'var(--text)'}}>{fmtM(limiteMei)}</div>
          </div>
        </div>

        {/* Barra de progresso */}
        <div style={{background:'var(--border)',borderRadius:99,height:10,overflow:'hidden',marginBottom:8}}>
          <div style={{width:`${pct}%`,height:'100%',background:barColor,
            borderRadius:99,transition:'width .6s ease'}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontSize:12,fontWeight:700,color:barColor}}>{pct.toFixed(1)}% utilizado</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>
            {restante>0?<span>Restam <strong style={{color:'var(--text)'}}>{fmtM(restante)}</strong></span>
              :<span style={{color:'#EF4444',fontWeight:700}}>⚠️ Limite atingido</span>}
          </div>
        </div>
        {pct>=80&&(
          <div style={{marginTop:12,background:pct>=90?'#FEF2F2':'#FFFBEB',border:`1px solid ${pct>=90?'#FCA5A5':'#FCD34D'}`,
            borderRadius:10,padding:'10px 12px',fontSize:12,color:pct>=90?'#DC2626':'#92400E',fontWeight:600,lineHeight:1.5}}>
            {pct>=90
              ?'⚠️ Atenção: você está próximo do limite do MEI. Considere consultar um contador sobre a transição para ME.'
              :'📊 Você já usou mais de 80% do limite. Monitore seu faturamento.'}
          </div>
        )}
      </div>

      {/* Nota: receita estimada */}
      <div style={{fontSize:11,color:'var(--muted)',marginBottom:16,paddingLeft:2}}>
        * Baseado nos valores registrados no app. Não inclui receitas não lançadas.
      </div>

      {/* Obrigações */}
      <div style={{marginBottom:8}}>
        <div style={{fontSize:13,fontWeight:800,color:'var(--text)',marginBottom:10}}>Obrigações do MEI</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {obrigacoes.map((o,i)=>(
            <div key={i} style={{background:'var(--surface)',borderRadius:14,padding:'14px 14px',
              boxShadow:'var(--sh)',display:'flex',gap:12,alignItems:'flex-start'}}>
              <div style={{fontSize:22,flexShrink:0,marginTop:1}}>{o.icon}</div>
              <div>
                <div style={{fontSize:13,fontWeight:800,color:'var(--text)'}}>{o.label}</div>
                <div style={{fontSize:12,color:'var(--muted)',marginTop:2,lineHeight:1.4}}>{o.desc}</div>
                <div style={{fontSize:11,color:'var(--brand)',fontWeight:700,marginTop:4}}>{o.dia}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

                    {darkMode?'Modo escuro ativado':'Modo claro ativado'}
                  </div>
                </div>
              </div>
              {/* Toggle switch */}
              <div onClick={()=>toggleDark(!darkMode)} style={{
                width:50,height:28,borderRadius:100,cursor:'pointer',
                background:darkMode?'var(--primary)':'#CBD5E1',
                position:'relative',transition:'background .25s',flexShrink:0}}>
                <div style={{
                  position:'absolute',top:3,
                  left:darkMode?22:3,
                  width:22,height:22,borderRadius:100,
                  background:'#fff',boxShadow:'0 1px 4px rgba(0,0,0,.25)',
                  transition:'left .25s'}}/>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* -- AddressModal -------------------------------------------------- */
function AddressModal({user,onSave,onClose}){
  const[form,setForm]=useState({street:'',number:'',complement:'',neighborhood:'',city:'',state:'',zip:'',...(user?.address||{})});
  const[cepStatus,setCepStatus]=useState(null); // null | 'loading' | 'ok' | 'error'
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const save=()=>{onSave({...user,address:form});};

  const handleCep=async(raw)=>{
    const cep=raw.replace(/\D/g,'');
    // Formata enquanto digita: 00000-000
    const fmt=cep.length>5?cep.slice(0,5)+'-'+cep.slice(5,8):cep;
    f('zip',fmt);
    if(cep.length!==8){setCepStatus(null);return;}
    setCepStatus('loading');
    try{
      const res=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      const data=await res.json();
      if(data.erro){setCepStatus('error');return;}
      setForm(p=>({...p,
        street:data.logradouro||p.street,
        neighborhood:data.bairro||p.neighborhood,
        city:data.localidade||p.city,
        state:data.uf||p.state,
        zip:fmt
      }));
      setCepStatus('ok');
    }catch{setCepStatus('error');}
  };

  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="mhead">
          <div><div className="msub">Localização</div><div className="mtitle">Meu Endereço</div></div>
          <button className="mclose" onClick={onClose}>x</button>
        </div>

        {/* CEP com feedback visual */}
        <div className="fg">
          <label className="fl">CEP</label>
          <div style={{position:'relative'}}>
            <input className="fi" value={form.zip} maxLength={9}
              onChange={e=>handleCep(e.target.value)}
              placeholder="00000-000"
              style={{paddingRight:36,
                borderColor:cepStatus==='ok'?'#10B981':cepStatus==='error'?'var(--red)':'var(--border)'}}/>
            <div style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',fontSize:16}}>
              {cepStatus==='loading'&&<span style={{animation:'spin 1s linear infinite',display:'inline-block'}}></span>}
              {cepStatus==='ok'&&<span style={{color:'#10B981'}}>OK</span>}
              {cepStatus==='error'&&<span style={{color:'var(--red)'}}>x</span>}
            </div>
          </div>
          {cepStatus==='ok'&&<div style={{fontSize:11,color:'#10B981',marginTop:4,fontWeight:600}}>OK Endereço encontrado automaticamente!</div>}
          {cepStatus==='error'&&<div style={{fontSize:11,color:'var(--red)',marginTop:4,fontWeight:600}}>CEP não encontrado. Preencha manualmente.</div>}
        </div>

        <div className="fg"><label className="fl">Rua / Avenida</label>
          <input className="fi" value={form.street} onChange={e=>f('street',e.target.value)} placeholder="Ex: Rua das Flores"/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div className="fg"><label className="fl">Número</label>
            <input className="fi" value={form.number} onChange={e=>f('number',e.target.value)} placeholder="123"/></div>
          <div className="fg"><label className="fl">Complemento</label>
            <input className="fi" value={form.complement} onChange={e=>f('complement',e.target.value)} placeholder="Apto 2"/></div>
        </div>
        <div className="fg"><label className="fl">Bairro</label>
          <input className="fi" value={form.neighborhood} onChange={e=>f('neighborhood',e.target.value)} placeholder="Centro"/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 80px',gap:10}}>
          <div className="fg"><label className="fl">Cidade</label>
            <input className="fi" value={form.city} onChange={e=>f('city',e.target.value)} placeholder="São Paulo"/></div>
          <div className="fg"><label className="fl">UF</label>
            <input className="fi" value={form.state} onChange={e=>f('state',e.target.value)} placeholder="SP" maxLength={2}/></div>
        </div>
        <button className="btn btn-p" onClick={save} style={{marginTop:14}}>OK Salvar endereço</button>
      </div>
    </div>
  );
}

function SplashScreen({onDone}){
  useEffect(()=>{
    const t=setTimeout(onDone,4200);
    return()=>clearTimeout(t);
  },[]);
  return(
    <div style={{position:'fixed',inset:0,background:'var(--brand)',
      display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',zIndex:200}}>
      <img src={LOGO_B64} alt="MEI Agenda"
        style={{width:140,height:105,objectFit:'contain',
          animation:'logoPop .7s cubic-bezier(.34,1.56,.64,1) .2s both'}}/>

    </div>
  );
}

function LoginScreen({onLogin,onGoRegister}){
  const[email,setEmail]=useState('');
  const[pass,setPass]=useState('');
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState('');

  const handleLogin=async()=>{
    if(!email||!pass){setErr('Preencha e-mail e senha');return;}
    setLoading(true);setErr('');
    await new Promise(r=>setTimeout(r,600));
    const stored=await db.get('credentials');
    if(!stored||stored.email!==email.trim().toLowerCase()){
      setErr('E-mail não encontrado');setLoading(false);return;
    }
    const passHash=await hashPassword(pass);
    if(stored.pass!==passHash){
      setErr('Senha incorreta');setLoading(false);return;
    }
    const sessionUser={email:stored.email,name:stored.name,loggedIn:true};
    await db.set('session',sessionUser);
    setLoading(false);
    onLogin(sessionUser);
  };

  return(
    <div style={{position:'fixed',inset:0,background:'#fff',
      display:'flex',flexDirection:'column',overflowY:'auto'}}>
      {/* Topo violeta */}
      <div style={{background:'var(--brand)',padding:'52px 28px 40px',flexShrink:0}}>
        <img src={LOGO_B64} alt="MEI Agenda"
          style={{width:72,height:54,objectFit:'contain',marginBottom:22}}/>
        <div style={{fontSize:22,fontWeight:700,color:'#fff',
          lineHeight:1.25,letterSpacing:'-.3px'}}>
          Seja bem-vindo
        </div>
        <div style={{fontSize:13,color:'rgba(255,255,255,.55)',marginTop:6}}>
          Acesse sua conta MEI Agenda
        </div>
      </div>

      {/* Corpo */}
      <div style={{flex:1,padding:'32px 24px 28px',display:'flex',flexDirection:'column'}}>
        {/* E-mail */}
        <div style={{marginBottom:18}}>
          <label style={{display:'block',fontSize:11,fontWeight:600,
            color:'var(--muted)',letterSpacing:'.8px',textTransform:'uppercase',
            marginBottom:7}}>E-mail</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
            placeholder="seu@email.com" inputMode="email" autoComplete="email"
            style={{width:'100%',padding:'15px 16px',border:'1.5px solid var(--border)',
              borderRadius:12,fontFamily:'var(--font)',fontSize:16,color:'var(--text)',
              background:'var(--bg)',outline:'none',WebkitAppearance:'none'}}
            onFocus={e=>{e.target.style.borderColor='var(--brand)';e.target.style.background='#fff';}}
            onBlur={e=>{e.target.style.borderColor='var(--border)';}}/>
        </div>

        {/* Senha */}
        <div style={{marginBottom:6}}>
          <label style={{display:'block',fontSize:11,fontWeight:600,
            color:'var(--muted)',letterSpacing:'.8px',textTransform:'uppercase',
            marginBottom:7}}>Senha</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)}
            placeholder="........" autoComplete="current-password"
            style={{width:'100%',padding:'15px 16px',border:'1.5px solid var(--border)',
              borderRadius:12,fontFamily:'var(--font)',fontSize:16,color:'var(--text)',
              background:'var(--bg)',outline:'none',WebkitAppearance:'none'}}
            onFocus={e=>{e.target.style.borderColor='var(--brand)';e.target.style.background='#fff';}}
            onBlur={e=>{e.target.style.borderColor='var(--border)';}}/>
        </div>

        {/* Esqueci */}
        <div style={{textAlign:'right',marginBottom:28}}>
          <span style={{fontSize:13,color:'var(--brand)',fontWeight:600,cursor:'pointer'}}>
            Esqueci minha senha
          </span>
        </div>

        {/* Erro */}
        {err&&<div style={{fontSize:13,color:'var(--red)',marginBottom:14,
          textAlign:'center',fontWeight:500}}>{err}</div>}

        {/* Botão entrar */}
        <button onClick={handleLogin} disabled={loading}
          style={{width:'100%',padding:17,background:'var(--brand)',color:'#fff',
            border:'none',borderRadius:14,fontFamily:'var(--font)',fontSize:16,
            fontWeight:700,cursor:'pointer',letterSpacing:'-.2px',
            boxShadow:'0 6px 22px rgba(124,92,252,.32)',
            opacity:loading?.7:1,transition:'all .2s',WebkitAppearance:'none'}}>
          {loading?'Entrando...':'Entrar'}
        </button>

        {/* Divisor */}
        <div style={{display:'flex',alignItems:'center',gap:12,margin:'26px 0'}}>
          <div style={{flex:1,height:1,background:'var(--border)'}}/>
          <div style={{fontSize:12,color:'var(--muted)',whiteSpace:'nowrap'}}>Não tem conta?</div>
          <div style={{flex:1,height:1,background:'var(--border)'}}/>
        </div>

        {/* Cadastro */}
        <div style={{textAlign:'center',fontSize:14,color:'var(--mid)'}}>
          <span onClick={onGoRegister}
            style={{color:'var(--brand)',fontWeight:700,cursor:'pointer'}}>
            Criar conta grátis
          </span>
        </div>
      </div>

      {/* Rodapé */}
      <div style={{padding:'16px 24px 36px',textAlign:'center',
        fontSize:11,color:'var(--muted)',lineHeight:1.7,flexShrink:0}}>
        Ao continuar você aceita nossos<br/>
        <span style={{color:'var(--brand)'}}>Termos de Uso</span>
        {' e '}
        <span style={{color:'var(--brand)'}}>Política de Privacidade</span>
      </div>
    </div>
  );
}

function RegisterScreen({onRegister,onGoLogin}){
  const[name,setName]=useState('');
  const[email,setEmail]=useState('');
  const[pass,setPass]=useState('');
  const[pass2,setPass2]=useState('');
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState('');

  const inStyle={width:'100%',padding:'15px 16px',border:'1.5px solid var(--border)',
    borderRadius:12,fontFamily:'var(--font)',fontSize:16,color:'var(--text)',
    background:'var(--bg)',outline:'none',WebkitAppearance:'none'};
  const lblStyle={display:'block',fontSize:11,fontWeight:600,color:'var(--muted)',
    letterSpacing:'.8px',textTransform:'uppercase',marginBottom:7};

  const handleRegister=async()=>{
    if(!name||!email||!pass){setErr('Preencha todos os campos');return;}
    if(pass!==pass2){setErr('As senhas não conferem');return;}
    if(pass.length<6){setErr('Senha precisa ter ao menos 6 caracteres');return;}
    setLoading(true);setErr('');
    await new Promise(r=>setTimeout(r,600));
    const passHash=await hashPassword(pass);
    const credentials={email:email.trim().toLowerCase(),pass:passHash,name};
    await db.set('credentials',credentials);
    const newUser={email:credentials.email,name,loggedIn:true};
    await db.set('session',newUser);
    setLoading(false);
    onRegister(newUser);
  };

  return(
    <div style={{position:'fixed',inset:0,background:'#fff',
      display:'flex',flexDirection:'column',overflowY:'auto'}}>
      {/* Topo */}
      <div style={{background:'var(--brand)',padding:'52px 28px 40px',flexShrink:0}}>
        <img src={LOGO_B64} alt="MEI Agenda"
          style={{width:72,height:54,objectFit:'contain',marginBottom:22}}/>
        <div style={{fontSize:22,fontWeight:700,color:'#fff',lineHeight:1.25}}>
          Criar conta
        </div>
        <div style={{fontSize:13,color:'rgba(255,255,255,.55)',marginTop:6}}>
          É rápido e gratuito
        </div>
      </div>

      <div style={{flex:1,padding:'32px 24px 28px',display:'flex',flexDirection:'column'}}>
        {[
          {lbl:'Nome completo',val:name,set:setName,type:'text',ph:'Seu nome',ac:'name'},
          {lbl:'E-mail',val:email,set:setEmail,type:'email',ph:'seu@email.com',ac:'email'},
          {lbl:'Senha',val:pass,set:setPass,type:'password',ph:'Mínimo 6 caracteres',ac:'new-password'},
          {lbl:'Confirmar senha',val:pass2,set:setPass2,type:'password',ph:'Repita a senha',ac:'new-password'},
        ].map(({lbl,val,set,type,ph,ac})=>(
          <div key={lbl} style={{marginBottom:16}}>
            <label style={lblStyle}>{lbl}</label>
            <input type={type} value={val} onChange={e=>set(e.target.value)}
              placeholder={ph} autoComplete={ac} style={inStyle}
              onFocus={e=>{e.target.style.borderColor='var(--brand)';e.target.style.background='#fff';}}
              onBlur={e=>{e.target.style.borderColor='var(--border)';}}/>
          </div>
        ))}

        {err&&<div style={{fontSize:13,color:'var(--red)',marginBottom:14,
          textAlign:'center',fontWeight:500}}>{err}</div>}

        <button onClick={handleRegister} disabled={loading}
          style={{width:'100%',padding:17,background:'var(--brand)',color:'#fff',
            border:'none',borderRadius:14,fontFamily:'var(--font)',fontSize:16,
            fontWeight:700,cursor:'pointer',opacity:loading?.7:1,
            boxShadow:'0 6px 22px rgba(124,92,252,.32)',WebkitAppearance:'none',
            marginTop:4}}>
          {loading?'Criando conta...':'Criar conta'}
        </button>

        <div style={{textAlign:'center',fontSize:14,color:'var(--mid)',marginTop:24}}>
          Já tem conta?{' '}
          <span onClick={onGoLogin}
            style={{color:'var(--brand)',fontWeight:700,cursor:'pointer'}}>
            Entrar
          </span>
        </div>
      </div>
    </div>
  );
}

  useEffect(()=>{(async()=>{
    const sess=await db.get('session');
    const usr=await db.get('user');
    const cos=await db.get('companies');
    const wds=await db.get('workdays');
    if(usr)setUser(usr);
    if(cos)setCompanies(cos);
    if(wds)setWorkDays(wds);
    if(localStorage.getItem('meiDark')==='1')document.body.classList.add('dark');
    if(sess?.loggedIn)setSession(sess);
    setReady(true);
  })();},[]);

  useEffect(()=>{if(ready)db.set('user',user);},[user,ready]);
  useEffect(()=>{if(ready)db.set('companies',companies);},[companies,ready]);
  useEffect(()=>{if(ready)db.set('workdays',workDays);},[workDays,ready]);

  const toast=msg=>{const id=++toastId.current;setToastQ(q=>[...q,{id,msg}]);};
  const dismissToast=id=>setToastQ(q=>q.filter(t=>t.id!==id));

  const saveUser=d=>{setUser(d);toast('Perfil salvo OK');};
  const addCo=d=>{setCompanies(p=>[...p,{...d,id:Date.now().toString()}]);toast('Cliente adicionado OK');};
  const editCo=d=>{setCompanies(p=>p.map(c=>c.id===d.id?d:c));toast('Cliente atualizado OK');};
  const delCo=id=>{
    setCompanies(p=>p.filter(c=>c.id!==id));
    setWorkDays(p=>{const n={...p};Object.keys(n).forEach(k=>{if(n[k].companyId===id)delete n[k];});return n;});
    toast('Cliente removido');
  };
  const saveDay=(k,data)=>{
    setWorkDays(p=>({...p,[k]:data}));
    const msgs={worked:'Dia registrado OK',dayoff:'Folga marcada OK',available:'Dia liberado OK'};
    toast(msgs[data.status]||'Salvo OK');
  };
  const delDay=k=>{setWorkDays(p=>{const n={...p};delete n[k];return n;});toast('Registro removido');};
  const dupDay=(tk,data)=>{setWorkDays(p=>({...p,[tk]:{...data}}));toast(`Copiado para ${fmtD(tk)} OK`);};
  const deleteAccount=async()=>{await db.set('user',null);await db.set('companies',[]);await db.set('workdays',{});await db.set('session',null);setUser(null);setCompanies([]);setWorkDays({});setSession(null);setAuthScreen('login');setShowDrawer(false);toast('Conta excluída');};

  const exportData=()=>{
    const backup={version:1,exportedAt:new Date().toISOString(),user,companies,workDays};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const date=new Date().toISOString().slice(0,10);
    a.href=url;a.download=`mei-agenda-backup-${date}.json`;
    a.click();URL.revokeObjectURL(url);
    toast('Backup exportado OK');
  };

  const importData=(file)=>{
    const reader=new FileReader();
    reader.onload=async(e)=>{
      try{
        const backup=JSON.parse(e.target.result);
        if(!backup.version||!backup.workDays){alert('Arquivo de backup inválido.');return;}
        if(!window.confirm('Isso vai substituir todos os seus dados atuais. Continuar?'))return;
        if(backup.user){await db.set('user',backup.user);setUser(backup.user);}
        if(backup.companies){await db.set('companies',backup.companies);setCompanies(backup.companies);}
        if(backup.workDays){await db.set('workdays',backup.workDays);setWorkDays(backup.workDays);}
        toast('Backup restaurado OK');
      }catch{alert('Erro ao ler o arquivo de backup.');}
    };
    reader.readAsText(file);
  };

  const userName=user?.name||session?.email?.split('@')[0]||'';

  const handleLogout=async()=>{
    await db.set('session',null);
    setSession(null);
    setAuthScreen('login');
    setShowDrawer(false);
  };

  // Enquanto carrega do IndexedDB - splash rápido
  if(!ready)return(
    <div style={{position:'fixed',inset:0,background:'var(--brand)',
      display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      <img src={LOGO_B64} alt="MEI Agenda"
        style={{width:120,height:90,objectFit:'contain'}}/>
      <div style={{marginTop:28,fontSize:11,fontWeight:600,letterSpacing:4,
        color:'rgba(255,255,255,.4)',textTransform:'uppercase'}}>
        MEI Agenda
      </div>
    </div>
  );

  // Splash animado - sempre ao abrir o app
  if(authScreen==='splash')
    return <SplashScreen onDone={()=>setAuthScreen(session?'app':'login')}/>;

  // Tela de login
  if(!session&&authScreen==='login')
    return <LoginScreen
      onLogin={s=>{setSession(s);setAuthScreen('app');}}
      onGoRegister={()=>setAuthScreen('register')}/>;

  // Tela de cadastro
  if(!session&&authScreen==='register')
    return <RegisterScreen
      onRegister={s=>{setSession(s);setAuthScreen('app');}}
      onGoLogin={()=>setAuthScreen('login')}/>;

  if(showCal)return(
    <div className="app">
      <CalendarPage
        workDays={workDays} companies={companies}
        userName={userName} user={user}
        onBack={()=>setShowCal(false)}
        onSaveDay={saveDay} onDelDay={delDay} onDupDay={dupDay}/>
      {toastQ.slice(-1).map(t=>(
        <Toast key={t.id} msg={t.msg} onDone={()=>dismissToast(t.id)}/>
      ))}
    </div>
  );

  return(
    <div className="app">
      {(tab==='clients'||tab==='mei')
        ? <div style={{background:'var(--brand)',padding:'12px 16px',flexShrink:0,display:'flex',alignItems:'center'}}>
            <button onClick={()=>setTab('home')} style={{background:'rgba(255,255,255,.15)',border:'none',
              color:'#fff',borderRadius:10,padding:'7px 14px',cursor:'pointer',fontSize:14,
              fontWeight:700,fontFamily:'var(--font)',display:'flex',alignItems:'center',gap:4}}>
              {'<'} Home
            </button>
          </div>
        : <header className="mhdr">
            <div className="mhdr-left" style={{display:'flex',alignItems:'center',gap:12}}>
              <img src={LOGO_B64} alt="logo"
                style={{width:48,height:36,objectFit:'contain',flexShrink:0,
                  filter:'var(--logo-filter)'}}/>
              <div>
                <div className="mhdr-label">{user?.name||session?.email?.split('@')[0]||''}</div>
                <div className="mhdr-title">MEI <span>Agenda</span></div>
              </div>
            </div>
            {tab==='home'&&<button onClick={()=>setShowDrawer(true)} style={{background:'transparent',border:'none',color:'var(--mid)',
              borderRadius:8,width:36,height:36,cursor:'pointer',display:'flex',
              flexDirection:'column',alignItems:'center',justifyContent:'center',gap:5}}>
              <span style={{display:'block',width:18,height:1.5,background:'var(--mid)',borderRadius:2}}/>
              <span style={{display:'block',width:14,height:1.5,background:'var(--mid)',borderRadius:2}}/>
              <span style={{display:'block',width:10,height:1.5,background:'var(--mid)',borderRadius:2}}/>
            </button>}
          </header>
      }

      <div className="content">
        {tab==='home'&&(
          <HomeView workDays={workDays} companies={companies} onGoCalendar={()=>setShowCal(true)}/>
        )}
        {tab==='clients'&&(
          <ClientesView companies={companies} workDays={workDays}
            user={user} onUserSave={saveUser}
            onAdd={addCo} onEdit={editCo} onDelete={delCo}
            openCo={openCo} onSetOpenCo={setOpenCo}/>
        )}
        {tab==='mei'&&(
          <MeiPage workDays={workDays} user={user}/>
        )}
      </div>

      <nav className="mtabs">
        {TABS.map(t=>(
          <button key={t.id} className={`mtab ${t.id==='cal'?'':tab===t.id?'on':''}`} onClick={()=>{
            if(t.id==='cal'){setShowCal(true);}
            else setTab(t.id);
          }}>
            <span className="mtab-icon">{t.icon}</span>{t.label}
          </button>
        ))}
      </nav>

      {toastQ.slice(-1).map(t=>(
        <Toast key={t.id} msg={t.msg} onDone={()=>dismissToast(t.id)}/>
      ))}

      {showDrawer&&<Drawer user={user} onClose={()=>setShowDrawer(false)}
        onEditProfile={()=>setShowProfile(true)}
        onEditAddress={()=>setShowAddress(true)}
        onSettings={()=>setShowSettings(true)}
        onMeiConfig={()=>setShowMeiConfig(true)}
        onLogout={handleLogout}
        onDeleteAccount={deleteAccount}
        onExport={exportData}
        onImport={importData}/>}

      {showProfile&&<UserProfileModal user={user}
        onSave={d=>{saveUser(d);setShowProfile(false);}}
        onClose={()=>setShowProfile(false)}/>}

      {showAddress&&<AddressModal user={user}
        onSave={d=>{saveUser(d);setShowAddress(false);toast('Endereço salvo OK');}}
        onClose={()=>setShowAddress(false)}/>}

      {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)}/>}
      {showMeiConfig&&<MeiConfigModal user={user}
        onSave={d=>{saveUser(d);setShowMeiConfig(false);toast('Configurações MEI salvas OK');}}
        onClose={()=>setShowMeiConfig(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js')
      .catch(err=>console.warn('SW falhou ao registrar:',err));
  });
}
</script>

</body>
</html>
